<script>
/* PERFECT V36: tento modul se vkládá dovnitř hlavní aplikace. */
const PerfectVouchers36=(()=>{
 let data=null,art='',pending=null,selected='',sortKey='number',sortDir=1,page=0,query='',artError='',dialogs=new Set();
 const admin=()=>window.PerfectAccess40?.can('vouchers.manage');
 const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const req=()=>crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
 const call=(name,args=[])=>{const token=sessionStorage.getItem('perfectAuthToken');return new Promise((resolve,reject)=>api(name,args,r=>{if(sessionStorage.getItem('perfectAuthToken')!==token)return reject(Error('Přihlášení se změnilo.'));resolve(r);},reject));};
 const cash=cents=>money(Number(cents||0)/100);
 const date=s=>s?String(s).split('-').reverse().join('.'):'—';
 const days=s=>s?Math.round((Date.parse(s+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000):null;
 // V42: barva celého řádku se řídí kalendářními dny do expirace, včetně dne 0.
 function color(v){const n=days(v.validTo);return n===null||!Number.isFinite(n)?'#737681':n<0?'#f4cccc':n<=4?'#ff0000':n<=9?'#cc0000':n<=15?'#f9cb9c':n<=24?'#f6b26b':n<=39?'#e69138':n<=58?'#93c47d':n<=69?'#6aa84f':'#38761d';}
 function ink42(hex){const rgb=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722>.179?'#111111':'#ffffff';}
 function dayLabel42(n){return n===null||!Number.isFinite(n)?'Datum neuvedeno':n<0?'Po expiraci · '+Math.abs(n)+' dnů':n===0?'Dnes':n+' '+(n===1?'den':n<=4?'dny':'dnů');}
 const style=document.createElement('style');style.textContent=`
 #perfectBoxesNav36[hidden]{display:none!important}.v36-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0}.v36-gift{padding:0;overflow:hidden;background:#0e0e11;border:1px solid #393940;border-radius:17px;color:#fff;cursor:pointer;text-align:left;transition:transform .18s,border-color .18s,box-shadow .18s}.v36-gift:hover,.v36-gift:focus-visible{transform:translateY(-3px);border-color:#ed1538;box-shadow:0 8px 25px #ed153820}.v36-gift[aria-pressed=true]{border:2px solid #ed1538}.v36-art{aspect-ratio:1536/330;background:#151519 center top/100% auto no-repeat;pointer-events:none}.v36-gift-value{display:block;font-size:clamp(32px,4vw,54px);line-height:1.2;font-weight:900;color:#ff334c;padding:16px 20px 5px;letter-spacing:-1px}.v36-gift small{display:block;padding:0 20px 20px;color:#c4c4cc}.v36-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.v36-toolbar .search{flex:1;min-width:210px}.v36-table{min-width:1200px}.v36-table th button{background:none;border:0;color:inherit;padding:8px 0;font:inherit;cursor:pointer;white-space:nowrap}.v36-table td{vertical-align:top}.v36-state{display:inline-block;border-left:5px solid var(--voucher-color);padding:5px 9px;background:#24242b;border-radius:4px;font-size:11px;font-weight:800;white-space:nowrap}.v36-table tr{box-shadow:inset 4px 0 var(--voucher-color)}.v36-code{font-family:monospace;font-weight:bold;font-size:14px}.v36-actions{display:flex;gap:6px;flex-wrap:wrap}.v36-note{max-width:270px;white-space:pre-wrap;overflow-wrap:anywhere}.v36-modal{width:min(950px,100%)}.v36-form label{display:flex;flex-direction:column;gap:6px}.v36-form .full{grid-column:1/-1}.v36-form textarea{min-height:100px}.v36-error{color:#ff9fae;white-space:pre-wrap}.v36-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}.v36-linked{border-left:3px solid #51c878;padding-left:10px}.v36-summary{display:flex;gap:20px;flex-wrap:wrap;margin:15px 0;color:#bbb}.v36-value-editor{margin:15px 0;padding:15px;border:1px solid #36363e;border-radius:12px}.v36-form button:disabled{opacity:.6;cursor:wait}.v36-art:not([style]){display:flex;align-items:center;justify-content:center}.v36-art:not([style]):before{content:attr(data-art-state);color:#eee;font-size:12px;font-weight:800;padding:15px}.v36-form small{color:#a9a9b3}.v36-page button:active{transform:scale(.98)}
 @media(max-width:600px){.v36-grid{grid-template-columns:1fr}.v36-form{grid-template-columns:1fr}.v36-footer{flex-wrap:wrap}}
 `;document.head.append(style);
 function mountArt(){document.querySelectorAll('[data-v49-original]').forEach(el=>{const p=(data?.products||[]).find(p=>p.id===el.dataset.v49Original),src=p?.imageUrl||p?.image||p?.artUrl||(Number(p?.amount)===200000?art:'');if(!src||!/^https:\/\/|^data:image\/(jpeg|png|webp);base64,/i.test(src))return;if(el.querySelector('img'))return;const img=document.createElement('img');img.alt='Původní poukaz PERFECT · '+cash(p.amount);img.src=src;img.onerror=()=>{img.remove();el.querySelector('.original-missing')?.removeAttribute('hidden');};el.querySelector('.original-missing')?.setAttribute('hidden','');el.prepend(img);});if(art)document.querySelectorAll('[data-v36-art]:not([data-v49-original])').forEach(el=>el.style.backgroundImage='url("'+art+'")');}
 function gift49(p){return `<button class="vcard" data-v36-value="${p.amount}" data-v49-original="${esc(p.id)}" aria-pressed="${selected===String(p.amount)}" aria-label="Otevřít poukazy za ${cash(p.amount)}"><div class="original-missing"><strong>${cash(p.amount)}</strong><small>${Number(p.amount)===200000?'Načítám původní obrázek…':'Původní obrázek této hodnoty lze přiřadit v editoru.'}</small></div><span class="imagebadge">${cash(p.amount)} · otevřít</span></button>`;}

 function loadArt(){if(art){mountArt();return;}if(pending)return;const token=sessionStorage.getItem('perfectAuthToken');artError='';pending=call('perfectVoucher36Art').then(r=>{if(sessionStorage.getItem('perfectAuthToken')!==token)return;if(!/^data:image\/(jpeg|png|webp);base64,/.test(r.src||''))throw Error('Podklad poukazu není platný.');art=r.src;document.querySelectorAll('[data-v40-art-retry]').forEach(el=>el.remove());mountArt();}).catch(err=>{if(sessionStorage.getItem('perfectAuthToken')!==token)return;artError=err.message;document.querySelectorAll('[data-v36-art]').forEach(el=>el.setAttribute('data-art-state','Podklad není dostupný'));document.querySelectorAll('.v36-grid').forEach(grid=>{if(grid.nextElementSibling?.hasAttribute('data-v40-art-retry'))return;const notice=document.createElement('div');notice.className='notice';notice.setAttribute('data-v40-art-retry','');notice.innerHTML='<span></span> <button class="btn secondary small" type="button">Načíst podklad znovu</button>';notice.querySelector('span').textContent=artError;notice.querySelector('button').onclick=loadArt;grid.after(notice);});}).finally(()=>pending=null);}

 function dialog(title,body){const el=document.createElement('div');el.className='overlay';el.innerHTML=`<section class="modal v36-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="eyebrow">AUTOMYČKA PERFECT</div><h2>${esc(title)}</h2></div><button type="button" class="close" aria-label="Zavřít">×</button></div>${body}</section>`;let busy=false;const close=()=>{if(busy)return;el.remove();dialogs.delete(el);};el.querySelector('.close').onclick=close;el.onclick=e=>{if(e.target===el)close();};el.setBusy=value=>{busy=value;el.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=value);};document.body.append(el);dialogs.add(el);return el;}
 function field(label,name,value='',type='text',extra=''){return `<label>${label}<input class="field" type="${type}" name="${name}" value="${esc(value)}" ${extra}></label>`;}
 function bind(el,name,payload,onSuccess){const form=el.querySelector('form');let requestId=req();form.addEventListener('input',()=>requestId=req());form.onsubmit=async e=>{e.preventDefault();if(form.dataset.saving)return;const values=Object.fromEntries(new FormData(form));let p;try{p=payload(values,form);p.requestId=requestId;}catch(error){el.querySelector('[data-v36-error]').textContent=error.message;PerfectFeedback36.show(false,error.message);return;}form.dataset.saving='1';el.setBusy(true);const btn=form.querySelector('[type=submit]'),label=btn.textContent;btn.textContent='Ukládám…';el.querySelector('[data-v36-error]').textContent='';try{const r=await call(name,[p]);if(!r?.success)throw Error('Server nepotvrdil uložení.');if(!el.isConnected)return;el.remove();dialogs.delete(el);await onSuccess(r);}catch(error){if(el.isConnected)el.querySelector('[data-v36-error]').textContent=error.message||String(error);}finally{delete form.dataset.saving;if(el.isConnected){el.setBusy(false);btn.textContent=label;}}};}
 const formEnd='<p class="full v36-error" data-v36-error role="status"></p><div class="full form-actions"><button type="submit" class="btn">Uložit</button></div></form>';
 function products(){return (data?.products||[]).filter(p=>p.active).sort((a,b)=>a.amount-b.amount);}
 function addValidity(from,p){const d=new Date(from+'T12:00:00Z');if(p.validityUnit==='DAYS')d.setUTCDate(d.getUTCDate()+p.validityCount);else{const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+p.validityCount);d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));}return d.toISOString().slice(0,10);}
 async function reload(){const r=await call('perfectVoucher36List');if(!r?.success)throw Error('Server nevrátil evidenci poukazů.');data=r;return r;}
 function saved(r){if(r.record){data.vouchers=data.vouchers.filter(v=>v.id!==r.record.id).concat(r.record);}if(state.page==='vouchers')render(false);}
 function chooseNew(){const ps=products();if(!ps.length)return alert('Nejdřív nastav aktivní hodnotu poukazu v ceníku.');const el=dialog('Vyber hodnotu nového poukazu',`<div class="v36-grid">${ps.map(p=>`<button class="v36-gift" data-new-type="${esc(p.id)}"><div class="v36-art" data-v36-art data-art-state="Načítám podklad poukazu…" role="img" aria-label="Automyčka PERFECT · dárkový poukaz"></div><strong class="v36-gift-value">${cash(p.amount)}</strong><small>Platnost ${p.validityCount} ${p.validityUnit==='DAYS'?'dnů':'měsíců'} · Vybrat ↗</small></button>`).join('')}</div>`);el.querySelectorAll('[data-new-type]').forEach(b=>b.onclick=()=>{el.remove();dialogs.delete(el);issue(ps.find(p=>p.id===b.dataset.newType));});mountArt();loadArt();}
 function buyerFields(v={}){return field('Jméno kupujícího','buyerName',v.buyerName)+field('Telefon','phone',v.phone,'tel')+field('E-mail','email',v.email,'email')+field('Vozidlo / SPZ','vehicle',v.vehicle)+`<label class="full">Poznámky<textarea class="field" name="notes" maxlength="3000">${esc(v.notes||'')}</textarea></label>`;}
 function issue(p){const el=dialog('Nový poukaz · '+cash(p.amount),`<form class="form-grid v36-form">${field('Kód předtištěného poukazu (nepovinné)','code','','text','maxlength="64" placeholder="Prázdné = vygenerovat nový kód"')}${field('Datum prodeje','soldAt',today(),'date','required')}${field('Platí od','validFrom',today(),'date','required')}${field('Platí do','validTo',addValidity(today(),p),'date','required')}<label>Způsob platby<select class="field" name="paymentMethod" required><option value="">Vyber platbu</option>${['Hotovost','Karta','Převod','CCS','Dar / propagace','Kompenzace','Jiné'].map(x=>`<option>${x}</option>`).join('')}</select></label>${field('Skutečně zaplaceno (Kč)','paid',p.amount/100,'number','min="0" step="0.01" required')}${buyerFields()}<p class="full muted">Poukaz se propojí pouze s jednoznačně nalezeným stávajícím zákazníkem s dokončenou návštěvou. Nový zákazník se nezakládá.</p>${formEnd}`);let manual=false;el.querySelector('[name=validTo]').oninput=()=>manual=true;el.querySelector('[name=validFrom]').onchange=e=>{if(!manual&&e.target.value)el.querySelector('[name=validTo]').value=addValidity(e.target.value,p);};bind(el,'perfectVoucher36Issue',f=>({...f,typeId:p.id}),saved);}
 function edit(v){if(!admin())return;const eligible=state.customers.filter(c=>state.orders.some(o=>String(o.CUSTOMER_ID)===String(c.CUSTOMER_ID)&&normalize(o.STAV_OBJEDNAVKY)==='dokonceno'&&String(o.DATUM_OBJEDNANI).slice(0,10)<=today()));const el=dialog('Upravit poukaz '+v.code,`<form class="form-grid v36-form">${field('Hodnota poukazu (Kč)','value',v.amount/100,'number',`min="0.01" step="0.01" ${v.redeemed>0?'disabled':''}`)+field('Platí od','validFrom',v.validFrom||'','date','required')}${field('Platí do','validTo',v.validTo||'','date','required')}${field('Způsob platby / původní záznam','paymentMethod',v.paymentMethod)}<label>Propojený zákazník<select class="field" name="customerId"><option value="">Bez propojení</option>${eligible.map(c=>`<option value="${esc(c.CUSTOMER_ID)}" ${v.customerId===String(c.CUSTOMER_ID)?'selected':''}>${esc(c.JMENO_PRIJMENI)} · ${esc(c.TELEFON||c.EMAIL||c.CUSTOMER_ID)}</option>`).join('')}</select></label>${buyerFields(v)}<label class="full"><span><input type="checkbox" name="resolve"> Údaje jsem zkontroloval — odstranit označení ke kontrole</span></label><label class="full"><span><input type="checkbox" name="cancel" ${v.state==='CANCELLED'?'checked disabled':''}> Zrušit poukaz</span></label><p class="full muted">${esc((v.issues||[]).join(' · '))}</p>${formEnd}`);el.querySelector('[name=cancel]').onchange=e=>{el.querySelector('[name=validFrom]').required=!e.target.checked;el.querySelector('[name=validTo]').required=!e.target.checked;};bind(el,'perfectVoucher36Edit',(f,form)=>({...f,id:v.id,version:v.version,resolve:form.elements.resolve.checked,cancel:form.elements.cancel.checked}),saved);}
 function redeem(v){const el=dialog('Uplatnit poukaz '+v.code,`<p>Zůstatek: <b>${cash(v.balance)}</b></p><form class="form-grid v36-form">${field('Čerpaná částka (Kč)','amount',v.balance/100,'number',`min="0.01" max="${v.balance/100}" step="0.01" required`)}${field('Číslo související zakázky (nepovinné)','orderId','','text','maxlength="80"')}<p class="full muted">Čerpání sníží zůstatek poukazu. Cenu zakázky ani rozdělení tržby mezi boxy tento krok nemění.</p>${formEnd}`);bind(el,'perfectVoucher36Redeem',f=>({...f,id:v.id,version:v.version}),saved);}
 async function history(v){const el=dialog('Historie poukazu '+v.code,'<p data-v36-history role="status">Načítám historii…</p>');try{const r=await call('perfectVoucher36History',[v.id]);if(!el.isConnected)return;el.querySelector('[data-v36-history]').innerHTML=(r.events||[]).map(e=>`<div class="service"><div><b>${esc(e.operation)}</b><div>${esc(e.at)} · ${esc(e.actor)}</div></div><div>Čerpáno ${cash(e.redeemed)}<br>Platnost do ${date(e.validTo)}</div></div>`).join('')||'Bez historie';}catch(e){if(el.isConnected)el.querySelector('[data-v36-history]').textContent=e.message;}}
 const columns=[['code','Kód'],['buyerName','Zákazník'],['soldAt','Datum vydání'],['status','Stav']];
 function detail49(v){const el=dialog('Poukaz '+v.code,`<div class="form-grid"><p>Hodnota<br><b>${cash(v.amount)}</b></p><p>Zůstatek<br><b>${cash(v.balance)}</b></p><p>Platnost<br><b>${date(v.validFrom)} — ${date(v.validTo)}</b></p><p>Stav<br><b>${esc(v.status)}</b></p><p>Kupující<br>${esc(v.buyerName||'—')}<br>${esc(v.phone||'—')}<br>${esc(v.email||'—')}</p><p>Vozidlo<br>${esc(v.vehicle||'—')}</p><p>Čerpáno<br>${cash(v.redeemed)} ${date(v.redeemedAt)}</p><p>Prodej / platba<br>${date(v.soldAt)} · ${esc(v.paymentMethod||'—')}</p><p class="full" style="white-space:pre-wrap">${esc(v.notes||'')}</p></div><div class="form-actions"><button class="btn secondary" data-v49-history>Historie</button>${['PLATNÝ','ČÁSTEČNĚ ČERPÁNO'].includes(v.status)&&window.PerfectAccess40?.can('vouchers.redeem')?'<button class="btn" data-v49-redeem>Uplatnit</button>':''}${admin()?'<button class="btn secondary" data-v49-edit>Upravit</button>':''}</div>`);for(const [name,fn] of [['history',history],['redeem',redeem],['edit',edit]]){const b=el.querySelector('[data-v49-'+name+']');if(b)b.onclick=()=>{el.remove();dialogs.delete(el);fn(v);};}}
 function drawTable(){const root=document.getElementById('v36-results');if(!root||!data)return;if(!selected&&!query){root.innerHTML='<div class="unselected"><strong>Vyber jednu z hodnot nahoře</strong><span>Otevře se přehled všech poukazů dané hodnoty.</span></div>';return;}const term=normalize(query).replace(/\s+/g,''),all=(data.vouchers||[]).filter(v=>selected==='ALL'||!selected||String(v.amount)===selected),filtered=all.filter(v=>!term||normalize([v.code,v.buyerName,v.phone,v.email,v.vehicle,v.notes,v.legacyNumber,v.number].join(' ')).replace(/\s+/g,'').includes(term));filtered.sort((a,b)=>{const x=a[sortKey]??'',y=b[sortKey]??'';return sortDir*(typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'cs',{numeric:true}));});page=Math.min(page,Math.max(0,Math.ceil(filtered.length/25)-1));const rows=filtered.slice(page*25,page*25+25),active=all.filter(v=>['PLATNÝ','ČÁSTEČNĚ ČERPÁNO'].includes(v.status)).length,used=all.filter(v=>v.status==='UPLATNĚNÝ'||v.balance===0&&v.redeemed>0).length;
 root.innerHTML=`<section class="selected-details"><div class="section-head"><div><h2>${selected==='ALL'?'Všechny poukazy':'Poukazy za '+cash(Number(selected))}</h2><p>Vystavené poukazy, jejich stav a uplatnění.</p></div>${window.PerfectAccess40?.can('vouchers.issue')?'<button class="btn primary" data-v49-issue>+ Vystavit tento poukaz</button>':''}</div><div class="metrics"><div class="metric"><span>Celkem vystavených</span><b>${all.length}</b></div><div class="metric"><span>Platných</span><b>${active}</b></div><div class="metric"><span>Uplatněných</span><b>${used}</b></div></div><div class="tablebox"><div class="tabletools"><b>Přehled vystavených poukazů</b><input class="search" data-v49-find placeholder="Hledat kód nebo zákazníka…" value="${esc(query)}"></div><div class="tablewrap"><table class="v36-table"><thead><tr>${columns.map(([key,label])=>`<th><button type="button" data-v36-sort="${key}">${label} ${sortKey===key?(sortDir===1?'↑':'↓'):'↕'}</button></th>`).join('')}<th>Akce</th></tr></thead><tbody>${rows.map(v=>`<tr class="${days(v.validTo)<0?'v42-expired':''}" data-v42-days="${days(v.validTo)??''}" style="--voucher-color:${color(v)};--voucher-ink:${ink42(color(v))}"><td><strong>${esc(v.code)}</strong><small style="display:block">${cash(v.amount)}</small></td><td>${esc(v.buyerName||'—')}</td><td>${date(v.soldAt||v.validFrom)}</td><td><span class="v36-state">${esc(v.status)}</span><small style="display:block">${dayLabel42(days(v.validTo))}</small></td><td><button class="btn slim ghost" data-v49-detail="${esc(v.id)}">Otevřít</button></td></tr>`).join('')||'<tr><td colspan="5">Žádné poukazy pro tuto hodnotu.</td></tr>'}</tbody></table></div><div class="v36-footer"><span>Strana ${page+1} / ${Math.max(1,Math.ceil(filtered.length/25))}</span><div class="v36-actions"><button class="btn slim" data-v36-prev ${page===0?'disabled':''}>← Předchozí</button><button class="btn slim" data-v36-next ${(page+1)*25>=filtered.length?'disabled':''}>Další →</button></div></div></section>`;
 root.querySelectorAll('[data-v36-sort]').forEach(b=>b.onclick=()=>{if(sortKey===b.dataset.v36Sort)sortDir*=-1;else{sortKey=b.dataset.v36Sort;sortDir=1;}drawTable();});root.querySelector('[data-v36-prev]').onclick=()=>{page--;drawTable();};root.querySelector('[data-v36-next]').onclick=()=>{page++;drawTable();};root.querySelectorAll('[data-v49-detail]').forEach(b=>b.onclick=()=>detail49(data.vouchers.find(v=>v.id===b.dataset.v49Detail)));root.querySelector('[data-v49-find]').oninput=e=>{const start=e.target.selectionStart;query=e.target.value;page=0;drawTable();const f=root.querySelector('[data-v49-find]');f.focus();f.setSelectionRange(start,start);};const issueButton=root.querySelector('[data-v49-issue]');if(issueButton)issueButton.onclick=()=>{const p=products().find(p=>String(p.amount)===selected);p?issue(p):chooseNew();};
 }

 async function render(fetch=true){const token=sessionStorage.getItem('perfectAuthToken');app.innerHTML='<section class="section"><h3>Dárkové poukazy</h3><p role="status">Načítám poukazy…</p></section>';try{if(fetch||!data)await reload();if(state.page!=='vouchers'||sessionStorage.getItem('perfectAuthToken')!==token)return;if(!data.installed){app.innerHTML=`<section class="section"><h3>Dárkové poukazy</h3><p>Evidence zatím není připravená.</p>${admin()?'<button class="btn" data-v36-setup>Připravit evidenci poukazů</button>':'<p>Požádej administrátora o přípravu evidence.</p>'}</section>`;const b=app.querySelector('[data-v36-setup]');if(b)b.onclick=async()=>{b.disabled=true;try{await call('perfectVoucher36Setup');await render();}catch(e){b.disabled=false;alert(e.message);}};return;}
