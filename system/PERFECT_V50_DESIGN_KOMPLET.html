<script id="perfect-v50-official-brand-script">
(function(){
 'use strict';
 if(window.__perfectV50BrandApplied)return;
 window.__perfectV50BrandApplied=true;
 const LOGO="https://res.cloudinary.com/ecxcwvyr/image/upload/v1792400548/Leskl%C3%A9_logo_Automy%C4%8Dka_Perfect.png";
 const q=(s,r=document)=>r.querySelector(s);
 function img(cls){const im=document.createElement('img');im.src=LOGO;im.alt='Automyčka PERFECT';im.className=cls||'p50-official-logo';im.loading='eager';im.decoding='async';return im;}
 function staticLogos(){
  for(const im of document.querySelectorAll('#authGate .auth-brand img,#perfectSidebar .brand-lockup img.p50-official-logo')){
   if(im.getAttribute('src')!==LOGO)im.setAttribute('src',LOGO);
   im.removeAttribute('srcset');im.alt='Oficiální logo Automyčka PERFECT';
  }
  const old=q('#perfectSidebar .brand-mark');if(old)old.hidden=true;
  const top=q('.layout>main>.top');
  if(top&&!q('.v50-header-brand',top)){
   const wrap=document.createElement('span');wrap.className='v50-header-brand';wrap.setAttribute('aria-label','Automyčka PERFECT');wrap.append(img());top.append(wrap);
  }
  if(!q('.v50-mobile-logo')){
   const dock=document.createElement('div');dock.className='v50-mobile-logo';dock.setAttribute('aria-hidden','true');dock.append(img());document.body.append(dock);
  }
 }
 function overlayLogos(){
  const dialogs=document.querySelectorAll('.overlay .modal .modal-head, .g45-dialog .modal-head, .pd-modal>.modal-head');
  for(const head of dialogs){
   if(!q('.v50-dialog-brand',head))head.append(img('v50-dialog-brand'));
  }
  for(const hdr of document.querySelectorAll('.b49 header.top .brand')){
   const im=q('img',hdr);if(im){if(im.getAttribute('src')!==LOGO)im.src=LOGO;}else if(!q('.p50-official-logo',hdr)){hdr.textContent='';hdr.append(img());}
  }
 }
 let scheduled=false;
 function refresh(){if(scheduled)return;scheduled=true;requestAnimationFrame(function(){scheduled=false;staticLogos();overlayLogos()});}
 // Nevkládá loga do zákaznických nebo vozidlových dat; logo automobilky zůstává samostatné.
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh,{once:true});else refresh();
 document.addEventListener('click',refresh,true);
 const app=q('#app');if(app){new MutationObserver(refresh).observe(app,{childList:true,subtree:true});}
})();
</script>
<!-- END PERFECT_V50_DESIGN_04_LOGO -->

<script id="perfect-v50-design-09-controller">
(function(){
 'use strict';
 if(window.__perfectV50DesignStage2)return;
 window.__perfectV50DesignStage2=true;
 const pages=['dashboard','orders','customers','vehicles'];
 const app=document.getElementById('app');
 const nav=document.getElementById('navigation');
 if(!app||!nav)return;
 let pending=false;
 function refresh(){
   pending=false;
   const active=nav.querySelector('[data-page].active');
   const name=active?String(active.getAttribute('data-page')||''):'';
   for(const page of pages){app.classList.toggle('v50-stage-'+page,page===name)}
 }
 function schedule(){if(pending)return;pending=true;requestAnimationFrame(refresh)}
 const observer=new MutationObserver(schedule);
 observer.observe(nav,{attributes:true,attributeFilter:['class','aria-current','aria-selected'],subtree:true,childList:true});
 observer.observe(app,{childList:true});
 document.addEventListener('click',schedule,true);
 refresh();

 window.perfectV50DesignStage2Check=function(){

 };
