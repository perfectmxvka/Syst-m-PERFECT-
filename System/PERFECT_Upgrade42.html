<style>
[hidden]{display:none!important}
.p42-arrival{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0}.p42-arrival small{font-size:11px;letter-spacing:.15em;text-transform:uppercase}.p42-arrival b{font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;text-shadow:0 2px 12px #0008}.p42-visit{display:flex;flex-direction:column;gap:4px;font-size:18px;text-align:center}.p42-visit-date{font-size:22px;font-weight:750}.p42-pay-preview{display:flex;align-items:center;flex-wrap:wrap;gap:14px;padding:20px;border:1px solid #ffffff20;border-radius:16px;background:linear-gradient(135deg,#ffffff09,#ffffff02)}.p42-pay-preview small,.p42-pay-preview strong{display:block}.p42-pay-preview small{color:var(--muted,#aaa);font-size:12px}.p42-pay-preview strong{font-size:22px;margin-top:5px}.p42-pay-preview p{width:100%;line-height:1.8;margin:6px 0 0}.p42-own-pay{display:block;font-size:12px;color:var(--muted,#aaa);margin-top:5px;line-height:1.7}
.v36-gift-value,.v36-gift small{text-align:center}.v36-actions{justify-content:center}.v36-table th{text-align:center!important;font-size:13px!important}.v36-table tbody tr td{background:var(--voucher-color,#222)!important;color:var(--voucher-ink,#fff)!important;text-align:center!important;font-size:16px!important;font-weight:600;border-bottom:1px solid #0003!important;padding:15px 12px!important}.v36-table tbody tr td a{color:inherit!important}.v36-table tbody tr:hover td{box-shadow:inset 0 0 0 999px #ffffff0a}.v36-table tbody tr td .pill{background:#0009;color:#fff;border-color:#ffffff30}.v36-table tbody tr td button{background:#131316!important;color:#fff!important;border:1px solid #ffffff65!important}.v36-table tbody tr td small{color:inherit!important;font-size:13px;opacity:.9}.v36-table tbody tr.v42-expired td{color:#541c1c!important}.p42-voucher-legend{padding:14px 16px;border:1px solid #ffffff20;border-radius:12px;margin:14px 0}.p42-voucher-legend summary{cursor:pointer;font-weight:650}.p42-voucher-legend span{display:inline-flex;align-items:center;gap:6px;margin:8px 12px 0 0}.p42-voucher-legend span{padding:7px 12px;border-radius:8px}.p42-voucher-legend i{width:15px;height:15px;border-radius:4px;display:inline-block}.p42-settings-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.p42-settings-nav button{padding:12px 18px;border:1px solid #ffffff25;border-radius:12px;background:#ffffff05;color:inherit;font:inherit;cursor:pointer}.p42-settings-nav button[aria-selected=true]{background:var(--red,#db092b);border-color:transparent;color:#fff}.p42-settings-head{margin-bottom:20px}.p42-settings-head h3{font-size:26px;margin:0 0 6px}.p42-settings-head p{color:var(--muted,#aaa);margin:0}.p42-shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.p42-shortcuts button{text-align:left;padding:22px;min-height:90px;border-radius:16px}.p42-panel{animation:p42Enter .18s ease-out}.p42-panel>.section{margin-bottom:18px}.p42-panel details{margin-top:16px}.p42-panel summary{cursor:pointer;padding:12px 0;font-weight:700}.p42-settings-nav button:focus-visible{outline:3px solid #fff;outline-offset:3px}@keyframes p42Enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.p42-panel{animation:none}}@media(max-width:600px){.p42-arrival b{font-size:34px}.p42-settings-nav{display:grid;grid-template-columns:1fr 1fr}.p42-settings-nav button{padding:12px 8px}.v36-table tbody tr td{font-size:14px!important}}
</style>
<script>
/* V42: původní formuláře se přesouvají i s ověřováním a událostmi. */
(()=>{
 let selected='overview';const old=renderSettings;
 renderSettings=function(){old();const nodes=Array.from(app.children),security=document.getElementById('perfectSecurity40'),admin=document.getElementById('perfectAdmin'),password=document.getElementById('perfPasswordForm')?.closest('.section'),data=nodes.find(n=>n.tagName==='SECTION'&&n!==security&&n!==password);
 const root=document.createElement('div');root.className='p42-settings';const tabs=[['overview','Přehled'],['operation','Provoz'],['data','Data a zálohy'],['account','Můj účet']];if(!tabs.some(t=>t[0]===selected))selected='overview';root.innerHTML='<div class="p42-settings-head"><h3>Nastavení aplikace</h3><p>Provoz, přístupy a přehled dat na jednom místě.</p></div><nav class="p42-settings-nav" role="tablist" aria-label="Nastavení">'+tabs.map(t=>`<button type="button" role="tab" id="p42-tab-${t[0]}" aria-controls="p42-panel-${t[0]}" data-p42-tab="${t[0]}">${t[1]}</button>`).join('')+'</nav>'+tabs.map(t=>`<div class="p42-panel" role="tabpanel" id="p42-panel-${t[0]}" aria-labelledby="p42-tab-${t[0]}" data-p42-panel="${t[0]}"></div>`).join('');app.append(root);const panel=k=>root.querySelector(`[data-p42-panel="${k}"]`);
 panel('overview').innerHTML=`<section class="section"><div class="eyebrow">PERFECT V44</div><h3>Stav systému</h3><p>${state.dashboard&&!state.dashboard.error?'Data jsou načtená.':'Připojení vyžaduje kontrolu.'}</p><div class="profile-grid"><div class="profile-stat"><small>Zakázky</small><b>${state.orders.length}</b></div><div class="profile-stat"><small>Zákazníci</small><b>${state.customers.length}</b></div><div class="profile-stat"><small>Vozidla</small><b>${state.vehicles.length}</b></div></div><button class="btn secondary" data-p42-refresh>Obnovit data</button></section>`;panel('overview').querySelector('button').onclick=()=>window.perfectRefresh();
 const caps=perfectAuthUser?.capabilities40||[],can=c=>window.PerfectAccess40?.can(c),links=[['calendar','Kalendář','orders.read'],['services','Ceník a služby','services.read'],['vouchers','Dárkové poukazy','vouchers.read'],['stats','Statistiky a výdělky',['finance.read','payroll.read']]].filter(x=>can(x[2]));panel('operation').innerHTML='<section class="section"><h3>Rychlé otevření agendy</h3><div class="p42-shortcuts">'+links.map(l=>`<button type="button" class="btn secondary" data-p42-go="${l[0]}">${l[1]}</button>`).join('')+(can('orders.read')?'<button class="btn secondary" data-p42-duplicates>Kontrola duplicit včetně historie</button>':'')+'</div></section>';root.querySelectorAll('[data-p42-go]').forEach(b=>b.onclick=()=>window.perfectGo(b.dataset.p42Go));const box=root.querySelector('[data-p42-boxes]');if(box)box.onclick=()=>window.perfectBoxesOpenV25();const dup=root.querySelector('[data-p42-duplicates]');if(dup)dup.onclick=()=>window.perfectDuplicatesOpen38();
 if(security)panel('access').append(security);if(data)panel('data').append(data);if(admin){const detail=document.createElement('details');detail.innerHTML='<summary>Pokročilá správa a údržba</summary>';detail.append(admin);panel('data').append(detail);}if(password)panel('account').append(password);else panel('account').innerHTML='<section class="section"><h3>Můj profil</h3><p>Osobní údaje, fotografie a vlastní odměny.</p><button class="btn secondary" data-p42-profile>Otevřít můj profil</button></section>';const profile=root.querySelector('[data-p42-profile]');if(profile)profile.onclick=()=>document.getElementById('perfectMyProfileButton')?.click();
 nodes.filter(n=>!root.contains(n)).forEach(n=>panel('data').append(n));function show(key){selected=key;root.querySelectorAll('[data-p42-tab]').forEach(b=>{const active=b.dataset.p42Tab===key;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});root.querySelectorAll('[data-p42-panel]').forEach(p=>p.hidden=p.dataset.p42Panel!==key);}const buttons=Array.from(root.querySelectorAll('[data-p42-tab]'));buttons.forEach((b,i)=>{b.onclick=()=>show(b.dataset.p42Tab);b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length];next.click();next.focus();};});show(selected);
 };
})();
</script>
