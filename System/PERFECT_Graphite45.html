<script>

const PerfectGraphite45=(()=>{
 const can=c=>window.PerfectAccess40?.can(c)===true,superAdmin=()=>perfectAuthUser?.superAdmin40===true,call=(name,args=[])=>new Promise((ok,no)=>api(name,args,ok,no));
 let activeTab='users',epoch=0,selectedId='',userFilter='',auditQuery='',auditKind='',auditPeriod='today',auditLimit=20;
 const role=u=>u?.role==='ADMINISTRATOR'?'ADMINISTRATOR':'PRACOVNIK',roleName=r=>r==='ADMINISTRATOR'?'Admin':'Pracovník';
 const name=u=>[u?.firstName,u?.surname].filter(Boolean).join(' ')||u?.username||'Neověřeno';
 const initials=s=>String(s||'?').trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
 const time=s=>s?new Date(s).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Prague'}):'—';
 const day=s=>s?new Date(s).toLocaleDateString('cs-CZ',{timeZone:'Europe/Prague'}):'—';
 const isoDay=s=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague'}).format(new Date(s||Date.now()));
 const labels={LOGIN:'Přihlášení',LOGOUT:'Odhlášení',OWNER_SETUP:'Založení účtu',perfectWebCreateOrderAddons31:'Vytvořil zakázku',perfectWebCreateOrder:'Vytvořil zakázku',perfectWebUpdateOrderAddons31:'Upravil zakázku',perfectWebUpdateOrder:'Upravil zakázku',perfectWebAdminArchiveOrder:'Archivoval zakázku',perfectDuplicates38Resolve:'Vyřešil duplicitu',perfectAdminUsersSave:'Změnil účet',perfectSecurity40Save:'Upravil oprávnění',perfectDetail44Save:'Uložil detailing',perfectDetail44MediaSave:'Nahrál fotografii detailingu',perfectV13MediaSave:'Nahrál fotografii',perfectBoxesSaveShiftV25:'Uložil směnu',perfectBoxesSaveOrderV25:'Přiřadil zakázku k boxu',perfectVoucher36Issue:'Vystavil poukaz',perfectVoucher36Redeem:'Uplatnil poukaz'};
 function section(action){return /User|Security|OWNER/.test(action)?'Uživatelé':/Boxes/.test(action)?'Boxy':/Voucher/.test(action)?'Poukazy':/Detail/.test(action)?'Detailing':/Order|Duplicates/.test(action)?'Zakázky':/Media/.test(action)?'Vozidla':/LOGIN|LOGOUT/.test(action)?'Přihlášení':'Systém';}
 function avatar(u){return `<span class="g45-avatar">${esc(initials(name(u)))}</span>`;}
 function frame(tab){if(!superAdmin()&&tab==='audit')tab='users';activeTab=tab;const root=document.createElement('div');root.className='g45';root.innerHTML=`<div class="g45-path"><span>PERFECT / Administrace / <b>${tab==='audit'?'Super admin':'Správa uživatelů'}</b></span><span class="g45-tag gray">Administrace</span></div><div data-g45-content class="g45-loading">Načítám…</div>`;root.querySelectorAll('[data-g45-tab]').forEach(b=>b.onclick=()=>mount(root,b.dataset.g45Tab));return root;}
 function mount(oldRoot,tab){const root=frame(tab);oldRoot.replaceWith(root);load(root);}
 async function load(root){const seq=++epoch,token=sessionStorage.getItem('perfectAuthToken'),valid=()=>seq===epoch&&root.isConnected&&sessionStorage.getItem('perfectAuthToken')===token&&!!perfectAuthUser;try{if(activeTab==='audit'){if(!superAdmin())throw Error('Přehled je dostupný pouze superadminovi.');const data=await call('perfectSecurity45Overview');if(valid())drawAudit(root,data,valid);return;}const results=await Promise.all([can('users.manage')?call('perfectAdminUsersList'):Promise.resolve({users:[]}),can('roles.manage')?call('perfectSecurity40Get'):Promise.resolve(null)]);if(valid())drawUsers(root,results[0].users||[],results[1],valid);}catch(e){if(valid()){const area=root.querySelector('[data-g45-content]');area.className='g45-notice';area.innerHTML='<b>Administraci se nepodařilo načíst</b><p>'+esc(e.message)+'</p><button class="g45-btn" data-g45-reload>Zkusit znovu</button>';area.querySelector('button').onclick=()=>load(root);}}}
 const groups=[['OSOBNÍ PŘEHLEDY',['roster.read']],['ZAKÁZKY, PROVOZ A FINANCE',['orders.read','orders.create','orders.edit','orders.archive','finance.read','payroll.read','prices.edit','shifts.manage','duplicates.manage']],['EVIDENCE A SPRÁVA SYSTÉMU',['customers.read','customers.edit','vehicles.read','vehicles.edit','services.read','services.edit','vouchers.read','vouchers.issue','vouchers.redeem','vouchers.manage','media.read','media.write','users.manage','roles.manage']]];
 function drawUsers(root,users,policy,valid){let current=users.find(u=>u.id===selectedId)||users[0]||null,selectedRole=current?role(current):'PRACOVNIK',draft=policy?JSON.parse(JSON.stringify(policy.roles)):null,saving=false;selectedId=current?.id||'';const area=root.querySelector('[data-g45-content]');area.className='';area.innerHTML=`<header class="g45-top"><div><div class="g45-kicker">PŘÍSTUPY A ROLE</div><h2>Správa uživatelů</h2><p class="g45-sub">Zakládání účtů a oprávnění jednotlivých rolí systému.</p></div><div class="g45-actions"><span class="g45-tag red">${superAdmin()?'Superadmin · plná práva':'Administrace'}</span>${can('users.manage')?'<button class="g45-btn primary" data-g45-new>＋ Nový uživatel</button>':''}</div></header><div class="g45-user-layout"><aside class="g45-panel"><div class="g45-panel-head"><div><h3>Uživatelé <span style="color:#969dab">(${users.length})</span></h3><p class="g45-sub">Vyber profil pro zobrazení jeho role</p></div></div><div class="g45-searchbox"><input data-g45-search placeholder="Jméno nebo role…" aria-label="Hledat uživatele" value="${esc(userFilter)}"></div><div class="g45-user-list" data-g45-users></div><div class="g45-foot"><small>Skrytý účet vlastníka se v seznamu nezobrazuje.</small></div></aside><section class="g45-panel"><div class="g45-panel-head"><div><h3 data-g45-name></h3><p class="g45-sub" data-g45-profile></p></div><div><label class="g45-role-label" for="g45-role">Oprávnění role</label><select id="g45-role" data-g45-role><option value="PRACOVNIK">Pracovník</option><option value="ADMINISTRATOR">Admin</option></select></div></div><form data-g45-policy><div class="g45-right-body"><div class="g45-notice">Přepínače mění oprávnění <b>celé vybrané role</b>, tedy všech účtů s touto rolí. Vybrání profilu samo o sobě roli účtu nemění.</div><div data-g45-groups></div><p class="g45-message" role="status" data-g45-message></p></div><footer class="g45-foot"><small data-g45-save-note></small><div class="g45-actions"><button class="g45-btn" type="button" data-g45-reset>Vrátit změny</button><button class="g45-btn primary" type="submit" data-g45-save>✓ Uložit oprávnění</button></div></footer></form></section></div>${policy?.ownerSetupAvailable43?'<div class="g45-notice" style="margin-top:20px">Založ si samostatný skrytý účet s plnými právy. <button class="g45-btn primary" data-g45-owner>Založit můj skrytý účet</button></div>':''}<p class="g45-bottom-note">Změna oprávnění odhlásí dotčené účty. Vlastní mzdu má zaměstnanec ve svém profilu.</p>`;
 const list=area.querySelector('[data-g45-users]'),select=area.querySelector('[data-g45-role]'),form=area.querySelector('form');
 const locked=key=>!policy||!policy.editableRoles43?.includes(selectedRole)||selectedRole==='PRACOVNIK'&&key==='roles.manage'||!superAdmin()&&!policy.ceiling43.includes(key)&&!policy.roles[selectedRole].includes(key);
 function person(){area.querySelector('[data-g45-name]').textContent=current?name(current):'Oprávnění rolí';area.querySelector('[data-g45-profile]').textContent=current?roleName(role(current))+' · @'+current.username+' · '+(current.active?'Aktivní účet':'Neaktivní účet'):'Bez vybraného účtu';select.value=selectedRole;const edit=area.querySelector('[data-g45-edit-account]');if(edit)edit.disabled=!current||role(current)==='ADMINISTRATOR'&&!superAdmin();}
 function drawList(){const q=normalize(userFilter);list.innerHTML=users.filter(u=>normalize([name(u),u.username,roleName(role(u))].join(' ')).includes(q)).map(u=>`<button type="button" class="g45-user-row ${u.id===selectedId?'selected':''}" data-g45-user="${esc(u.id)}" ${saving?'disabled':''}>${avatar(u)}<span class="g45-user-name"><strong>${esc(name(u))}</strong><small>${roleName(role(u))}</small></span><i class="g45-dot ${u.active?'':'off'}" title="${u.active?'Aktivní účet':'Neaktivní účet'}"></i></button>`).join('')||'<div class="g45-loading">Žádné odpovídající účty.</div>';list.querySelectorAll('[data-g45-user]').forEach(b=>b.onclick=()=>{current=users.find(u=>u.id===b.dataset.g45User);selectedId=current.id;selectedRole=role(current);person();drawList();drawPerms();});}
 function drawPerms(){const box=area.querySelector('[data-g45-groups]');if(!policy){box.innerHTML='<p class="g45-sub">Správa oprávnění není pro tvůj účet povolená.</p>';area.querySelector('[data-g45-save]').hidden=true;area.querySelector('[data-g45-reset]').hidden=true;return;}box.innerHTML=groups.map(([title,keys])=>{const catalog=policy.catalog.filter(c=>keys.includes(c.key));return `<section class="g45-group"><div class="g45-group-head"><span>${title}</span><small>${catalog.length} oprávnění</small></div><div class="g45-perms">${catalog.map(c=>`<label class="g45-permission"><span><strong>${esc(c.label)}</strong><small data-g45-state="${c.key}">${draft[selectedRole].includes(c.key)?'Povolit':'Zamítnout'}${locked(c.key)?' · pouze pro čtení':''}</small></span><span class="g45-switch"><input type="checkbox" role="switch" data-g45-cap="${c.key}" aria-label="${esc(c.label)} · ${roleName(selectedRole)}" ${draft[selectedRole].includes(c.key)?'checked':''} ${locked(c.key)||saving?'disabled':''}><i></i></span></label>`).join('')}</div></section>`;}).join('');box.querySelectorAll('[data-g45-cap]').forEach(input=>input.onchange=()=>{const key=input.dataset.g45Cap;draft[selectedRole]=draft[selectedRole].filter(k=>k!==key);if(input.checked)draft[selectedRole].push(key);box.querySelector(`[data-g45-state="${key}"]`).textContent=input.checked?'Povolit':'Zamítnout';});const editable=policy.editableRoles43?.includes(selectedRole);area.querySelector('[data-g45-save]').disabled=!editable||saving;area.querySelector('[data-g45-reset]').disabled=saving;area.querySelector('[data-g45-save-note]').textContent=editable?'Změny se uloží na server po potvrzení.':'Tuto roli může měnit pouze superadmin.';}
 select.onchange=()=>{selectedRole=select.value;drawPerms();};area.querySelector('[data-g45-search]').oninput=e=>{userFilter=e.target.value;drawList();};area.querySelector('[data-g45-reset]').onclick=()=>{draft=JSON.parse(JSON.stringify(policy.roles));drawPerms();area.querySelector('[data-g45-message]').textContent='Neuložené změny byly vráceny.';};
 form.onsubmit=async e=>{e.preventDefault();if(saving||!policy||!policy.editableRoles43?.includes(selectedRole))return;saving=true;const message=area.querySelector('[data-g45-message]');message.textContent='Ukládám oprávnění…';select.disabled=true;draft.SMENAR=draft.PRACOVNIK.slice();drawList();drawPerms();try{const r=await call('perfectSecurity40Save',[{version:policy.version,roles:draft}]);if(!valid())return;policy.version=r.version;policy.roles=JSON.parse(JSON.stringify(draft));message.textContent='Oprávnění jsou uložená. Dotčené účty se přihlásí znovu.';}catch(err){if(valid())message.textContent=err.message;}finally{if(valid()){saving=false;select.disabled=false;drawList();drawPerms();}}};
 area.querySelector('[data-g45-new]')?.addEventListener('click',()=>openAccount());area.querySelector('[data-g45-owner]')?.addEventListener('click',()=>openOwner());
 if(can('users.manage')){const edit=document.createElement('button');edit.type='button';edit.className='g45-btn';edit.textContent='Upravit účet';edit.dataset.g45EditAccount='true';edit.onclick=()=>openAccount(current?.id);area.querySelector('.g45-actions').append(edit);}person();drawList();drawPerms();
 }
 function openAccount(id){Promise.resolve(window.perfectAdminUsersOpen()).then(()=>{const overlay=document.getElementById('pa-users-overlay');if(!overlay)return;overlay.classList.add('g45-dialog');overlay.querySelector(id?'[data-edit="'+id+'"]':'#pa-add')?.click();});}
 function openOwner(){window.perfectCreateOwner43?.();document.querySelector('[data-p43-owner-form]')?.closest('.overlay')?.classList.add('g45-dialog');}
 function chart(points){const max=Math.max(1,...points.map(x=>x.count));return `<div class="g45-chart" role="img" aria-label="Počet zaznamenaných událostí za 7 dní: ${esc(points.map(p=>day(p.date)+': '+p.count).join(', '))}">${points.map(p=>`<span class="g45-bar" title="${esc(day(p.date)+': '+p.count)}"><i style="height:${Math.max(p.count?3:0,Math.round(p.count/max*100))}%"></i><small>${esc(new Date(p.date+'T12:00:00Z').toLocaleDateString('cs-CZ',{weekday:'short'}))}</small></span>`).join('')}</div>`;}
 function drawAudit(root,data,valid){const area=root.querySelector('[data-g45-content]');area.className='';let selected=data.users.find(u=>u.id===selectedId)||data.users[0];const s=data.summary;area.innerHTML=`<header class="g45-top"><div><div class="g45-kicker">NEVEŘEJNÁ ADMINISTRÁTORSKÁ SEKCE</div><h2>Super admin centrum</h2><p class="g45-sub">Centrální pohled na aktivitu uživatelů a přístupové události systému.</p></div><div class="g45-actions"><span class="g45-tag red">Pouze Super admin</span><button class="g45-btn" data-g45-export>↓ Export logů</button><button class="g45-btn" data-g45-refresh>Obnovit</button></div></header><div class="g45-metrics">${[['Celkem uživatelů',s.totalUsers,'Včetně '+s.activeUsers+' aktivních'],['Aktivní relace',s.sessionUsers,'Účty s platným přihlášením'],['Události dnes',s.eventsToday,'Zaznamenané pracovní úkony'],['Poslední přihlášení',time(s.lastLogin),s.lastLogin?day(s.lastLogin):'Zatím bez záznamu']].map(x=>`<article class="g45-metric"><small>${x[0]}</small><strong>${x[1]}</strong><p>${x[2]}</p></article>`).join('')}</div><div class="g45-activity-layout"><section class="g45-panel"><div class="g45-panel-head"><div><h3>Aktivita jednotlivých uživatelů</h3><p class="g45-sub">Události zaznamenané při vykonaných akcích v aplikaci</p></div><span class="g45-tag">Přehled</span></div><div class="g45-filters"><input data-g45-audit-search placeholder="Hledat uživatele nebo akci…" aria-label="Hledat aktivitu" value="${esc(auditQuery)}"><select data-g45-audit-kind aria-label="Výsledek"><option value="">Všechny události</option><option value="OK">Provedené</option><option value="FAILED">Neprovedené</option></select><select data-g45-audit-period aria-label="Období"><option value="today">Dnes</option><option value="week">7 dní</option><option value="all">Vše načtené</option></select></div><div class="g45-table-wrap"><table class="p40-audit-table"><thead><tr><th>Čas</th><th>Uživatel</th><th>Činnost</th><th>Sekce</th><th>Výsledek</th></tr></thead><tbody data-g45-events></tbody></table></div><button class="g45-loadmore" data-g45-more>Zobrazit více událostí ↓</button></section><aside class="g45-panel"><div class="g45-panel-head"><div><h3>Detail vybraného uživatele</h3><p class="g45-sub">Souhrn zaznamenaných aktivit a relací</p></div></div><div class="g45-person-detail" data-g45-person></div></aside></div><p class="g45-bottom-note">Zobrazuje se nejvýše ${data.loadedEvents} nejnovějších z ${s.totalEvents} auditních událostí. Souhrny a grafy používají celou uloženou historii. Aktivní relace neznamená, že uživatel právě sleduje stránku.</p><div data-g45-event-detail></div>`;
 const person=()=>{const u=selected,p=area.querySelector('[data-g45-person]');p.innerHTML=u?`<div class="g45-person-hero">${avatar(u)}<div><h3>${esc(name(u))}</h3><span class="g45-tag ${u.sessionCount?'':'gray'}">${u.sessionCount?'Platná relace':'Bez platné relace'}</span><p class="g45-sub">${roleName(role(u))} · @${esc(u.username)}</p></div></div><div class="g45-info-line"><span>Upravené zakázky</span><b>${u.activity.editedOrders}</b></div><div class="g45-info-line"><span>Poslední přihlášení</span><b>${time(u.activity.lastLogin)}</b></div><div class="g45-info-line"><span>Poslední událost</span><b>${time(u.activity.lastEvent)}</b></div><h3 class="g45-chart-label">Aktivita za posledních 7 dní</h3>${chart(u.activity.week)}<div class="g45-notice">Přístup je ověřený na serveru. Přehled eviduje pracovní akce v aplikaci. Soukromou činnost mimo systém nesleduje.</div>`:'<div class="g45-notice">Vyber uživatele kliknutím na jeho událost. Zatím není dostupný profil.</div>';};
 function filtered(){const q=normalize(auditQuery),today=isoDay(),start=new Date(today+'T12:00:00Z');start.setUTCDate(start.getUTCDate()-6);return data.events.filter(x=>(!q||normalize([x.actor,labels[x.action]||x.action,x.target].join(' ')).includes(q))&&(!auditKind||x.status===auditKind)&&(auditPeriod==='all'||auditPeriod==='today'&&isoDay(x.at)===today||auditPeriod==='week'&&isoDay(x.at)>=start.toISOString().slice(0,10)));}
 function events(){const rows=filtered();area.querySelector('[data-g45-events]').innerHTML=rows.slice(0,auditLimit).map(x=>`<tr data-g45-event="${esc(x.id)}"><td>${time(x.at)}</td><td><span class="g45-person"><span class="g45-avatar">${esc(initials(x.actor))}</span>${esc(x.actor||'Neověřeno')}</span></td><td><b>${esc(labels[x.action]||x.action)}</b>${x.target?'<small>'+esc(x.target)+'</small>':''}<small>${day(x.at)}</small></td><td>${section(x.action)}</td><td><span class="g45-tag ${x.status==='OK'?'':'red'}">${x.status==='OK'?'Provedeno':'Neprovedeno'}</span></td></tr>`).join('')||'<tr><td colspan="5">Žádné události pro tento filtr.</td></tr>';area.querySelector('[data-g45-more]').hidden=auditLimit>=rows.length;area.querySelectorAll('[data-g45-event]').forEach(tr=>tr.onclick=()=>{const event=data.events.find(x=>x.id===tr.dataset.g45Event);selected=data.users.find(u=>u.id===event.actorId);selectedId=selected?.id||'';person();});}
 area.querySelector('[data-g45-audit-search]').oninput=e=>{auditQuery=e.target.value;auditLimit=20;events();};area.querySelector('[data-g45-audit-kind]').value=auditKind;area.querySelector('[data-g45-audit-kind]').onchange=e=>{auditKind=e.target.value;auditLimit=20;events();};area.querySelector('[data-g45-audit-period]').value=auditPeriod;area.querySelector('[data-g45-audit-period]').onchange=e=>{auditPeriod=e.target.value;auditLimit=20;events();};area.querySelector('[data-g45-more]').onclick=()=>{auditLimit+=20;events();};area.querySelector('[data-g45-refresh]').onclick=()=>load(root);area.querySelector('[data-g45-export]').onclick=()=>download(filtered());person();events();
 }
 function download(events){const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"',rows=[['Čas','Uživatel','Činnost','Cíl','Výsledek'],...events.map(x=>[x.at,x.actor,labels[x.action]||x.action,x.target,x.status])],url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='perfect_aktivity_'+isoDay()+'.csv';a.click();URL.revokeObjectURL(url);}
 function open(tab='users'){if(tab==='audit'?!superAdmin():!can('users.manage')&&!can('roles.manage'))return;activeTab=tab;state.page='admin45';render();}
 const oldRender45=render;render=function(){const active=state.page==='admin45';document.body.classList.toggle('g45-admin',active);if(active){document.body.classList.remove('detailing-theme','b49-theme','v49-theme');if(activeTab==='audit'&&!superAdmin()||activeTab==='users'&&!can('users.manage')&&!can('roles.manage')){state.page='dashboard';return oldRender45.apply(this,arguments);}const root=frame(activeTab);app.replaceChildren(root);load(root);nav();return;}const result=oldRender45.apply(this,arguments);nav();return result;};
 const originalSettings45=renderSettings;renderSettings=function(){originalSettings45();nav();};
 function nav(){const n=document.getElementById('navigation');if(!n)return;let users=document.getElementById('g45UsersNav'),owner=document.getElementById('g45SuperNav');if(!users){users=document.createElement('button');users.id='g45UsersNav';users.innerHTML='<span class="ico">♟</span>Správa uživatelů';users.onclick=()=>open('users');n.append(users);}if(!owner){owner=document.createElement('button');owner.id='g45SuperNav';owner.innerHTML='<span class="ico">◈</span>Super admin';owner.onclick=()=>open('audit');n.prepend(owner);}users.hidden=!can('users.manage')&&!can('roles.manage');owner.hidden=!superAdmin();users.classList.toggle('active',state.page==='admin45'&&activeTab==='users');owner.classList.toggle('active',state.page==='admin45'&&activeTab==='audit');}
 const oldLogin45=showLogin;showLogin=function(){epoch++;activeTab='users';selectedId='';userFilter='';document.body.classList.remove('g45-admin','b49-theme','v49-theme');document.getElementById('g45SuperNav')?.remove();document.getElementById('g45UsersNav')?.remove();return oldLogin45.apply(this,arguments);};
 return {open};
})();
</script>
