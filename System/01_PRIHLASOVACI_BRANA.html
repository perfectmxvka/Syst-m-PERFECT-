    /* Background is the edited exact photograph from the selected PERFECT concept. */
    .wallpaper::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(0,0,0,.03),rgba(0,0,0,.10) 35%,rgba(0,0,0,.08) 65%,rgba(0,0,0,.02)); }
    .login-screen { position:relative; z-index:1; min-height:100svh; display:flex; flex-direction:column; align-items:center;
      padding: clamp(48px, 11.4svh, 107px) 22px 55px; }
    .logo { display:block; width:min(760px, 78vw); max-width:100%; height:auto; filter:drop-shadow(0 2px 12px rgba(0,0,0,.5)); }
    .intro { text-align:center; margin-top: 45px; text-shadow:0 2px 15px rgba(0,0,0,.8); }
    .intro h1 { font-size:clamp(24px, 2.1vw, 36px); margin:0; font-weight:750; letter-spacing:-.7px; line-height:1.2; }
    .intro p {font-size:clamp(18px, 1.65vw, 26px); color:#e0dee0; margin:9px 0 0; font-weight:400;}
    .auth-panel { width:min(573px, 100%); margin-top:31px; padding:39px 39px 34px; position:relative;
      isolation:isolate; border-radius:20px; background:linear-gradient(145deg,rgba(18,12,14,.987),rgba(7,8,9,.988) 42%,rgba(12,7,8,.992));
      border:1px solid rgba(255,126,126,.9);
      box-shadow:0 0 3px 1px rgba(255,38,50,.74),0 0 24px rgba(245,5,25,.47),0 0 50px rgba(235,0,5,.25),inset 0 0 60px rgba(125,0,9,.15); }
    .auth-panel::before {content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;border-radius:inherit;
      background:radial-gradient(ellipse at 0% 15%, rgba(135,0,0,.12), transparent 60%);}
    .field {height:74px; border:1px solid #55545a; background:linear-gradient(90deg,#19171a,#171718 65%,#101011); border-radius:11px;
      display:flex; align-items:center; gap:23px; padding:0 18px; transition:border-color .16s,box-shadow .16s; }
    .field:focus-within {border-color:var(--redlight); box-shadow:0 0 0 3px rgba(244,38,52,.16);}
    .field + .field {margin-top:22px;}
    .field svg {width:31px;height:31px;flex-shrink:0;color:#fafafa;stroke-width:1.7;}
    .field input {width:100%;color:#fff;background:transparent;border:0;outline:0;font:400 20px/1.4 Arial,Helvetica,sans-serif;min-width:0;}
    .field input::placeholder {color:#bdbabd;opacity:1;}
    input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
       -webkit-text-fill-color:#fff; transition:background-color 9999s ease-in-out 0s; caret-color:#fff; }
    .reveal {appearance:none;display:grid;place-items:center;background:none;border:0;color:#fff;padding:6px;cursor:pointer;border-radius:6px;}
    .reveal:hover,.reveal:focus-visible {background:rgba(255,255,255,.1);outline:none;}
    .reveal svg {width:28px;height:28px;stroke-width:1.6;}
    .options {display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 26px;}
    .remember {display:inline-flex;align-items:center;gap:13px;cursor:pointer;font-size:17px;white-space:nowrap;user-select:none;}
    .remember input {width:26px;height:26px;appearance:none;margin:0;background:transparent;border:1.5px solid #f8cbcb;border-radius:5px;display:grid;place-items:center;cursor:pointer;}
    .remember input:checked {background:var(--red);border-color:var(--red);}
    .remember input:checked::after {content:"";width:12px;height:7px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);}
    .remember input:focus-visible {outline:2px solid white;outline-offset:3px;}
    .forgot {appearance:none;background:none;border:0;padding:8px 0;cursor:pointer;font-size:16px;color:#ff2839;font-weight:400;text-align:right;white-space:nowrap;}
    .forgot:hover,.forgot:focus-visible {text-decoration:underline;color:#ff6c75;}
    .submit {display:flex;align-items:center;justify-content:center;gap:22px;border:0;width:100%;min-height:70px;
      border-radius:11px;background:linear-gradient(100deg,#ff172b,#e80016 72%,#fb1026);color:#fff;font-weight:700;font-size:22px;
      cursor:pointer;box-shadow:0 6px 24px rgba(216,0,21,.15);transition:transform .16s,filter .16s,box-shadow .16s;}
    .submit:hover {filter:brightness(1.13);box-shadow:0 5px 28px rgba(244,0,20,.5);transform:translateY(-1px);}
    .submit:active {transform:translateY(0);}
    .submit:focus-visible {outline:2px solid white;outline-offset:4px;}
    .submit[disabled] {cursor:wait;opacity:.68;transform:none;}
    .submit svg {width:28px;height:28px;stroke-width:2.1;}
    .notice {display:none;margin-top:17px;line-height:1.45;font-size:14px;border:1px solid #ff5764;background:#2e1016;color:#fff;padding:12px;border-radius:9px;}
    .notice.show {display:block;}
    .notice.info {border-color:#878787;background:#242424;}
    dialog {border:1px solid #ff3448;border-radius:16px;max-width:min(420px,calc(100vw - 36px));padding:30px;color:#fff;background:#121214;box-shadow:0 24px 120px #000;}
    dialog::backdrop {background:rgba(0,0,0,.82);backdrop-filter:blur(4px);}
    dialog h2 {margin:0 0 12px;font-size:22px;}
    dialog p {line-height:1.5;color:#ddd;}
    dialog button {cursor:pointer;background:#ed1026;color:#fff;padding:12px 28px;border:none;border-radius:9px;font-size:15px;}
    @media (max-width:650px) {
      .wallpaper { background-size:auto 100%; background-position:right center; }
      .wallpaper::after {background:rgba(0,0,0,.45);}
      .login-screen {justify-content:center; padding:35px 18px max(32px,env(safe-area-inset-bottom));}
      .logo {width:min(510px, 100%);margin-bottom:0;}
      .intro {margin-top:39px;}
      .intro h1 {font-size:clamp(23px,6.2vw,30px);letter-spacing:-.4px;}
      .intro p {font-size:17px;margin-top:10px;}
      .auth-panel {margin-top:30px;padding:27px 21px 25px;border-radius:17px;box-shadow:0 0 20px rgba(236,12,27,.45);}
      .field {height:64px;padding:0 14px;gap:12px;border-radius:10px;}
      .field + .field {margin-top:16px;}
      .field svg {width:24px;height:24px;}
      .field input {font-size:16px;}
      .reveal svg {width:24px;height:24px;}
      .options {margin:19px 0 24px;gap:9px;}
      .remember {font-size:13px;gap:9px;}
      .remember input {width:21px;height:21px;}
      .forgot {font-size:13px;}
      .submit {min-height:61px;font-size:19px;gap:15px;}
    }
    @media (max-width:365px) {
      .auth-panel {padding:24px 15px;}
      .options {flex-wrap:wrap;}
      .forgot {margin-left:auto;}
    }
    @media (max-height:730px) and (min-width:651px) {
      .login-screen {padding-top:24px;padding-bottom:20px;}
      .logo {width:min(620px,70vw);}
      .intro {margin-top:25px;}
      .auth-panel {margin-top:18px;padding:23px 30px;}
      .field {height:58px;}.field + .field {margin-top:13px;}
      .options {margin:14px 0 15px;}.submit {min-height:58px;}
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after {transition:none !important;} }

    <section class="auth-panel" aria-label="Přihlašovací formulář">
      <form id="perfect-login" autocomplete="on" novalidate>
        <label class="field" for="username">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Uživatelské jméno" aria-label="Uživatelské jméno" required>
        </label>
        <label class="field" for="password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Heslo" aria-label="Heslo" required>
          <button class="reveal" type="button" id="toggle-password" aria-label="Zobrazit heslo" aria-pressed="false" title="Zobrazit heslo">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </label>
        <div class="options">
          <label class="remember"><input type="checkbox" id="remember" name="remember"><span>Zapamatovat si mě</span></label>
          <button class="forgot" type="button" id="forgot">Zapomněli jste heslo?</button>
        </div>
        <button type="submit" class="submit" id="login-button"><span id="submit-text">Přihlásit se</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        </button>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <dialog id="recovery-dialog"><h2>Obnova hesla</h2><p>O změnu přístupového hesla požádejte správce systému Automyčka PERFECT.</p><form method="dialog"><button>Rozumím</button></form></dialog>
  <script>
    (() => {
      'use strict';
      const form = document.getElementById('perfect-login');
      const password = document.getElementById('password');
      const username = document.getElementById('username');
      const toggle = document.getElementById('toggle-password');
      const remember = document.getElementById('remember');
      const notice = document.getElementById('notice');
      const submitButton = document.getElementById('login-button');
      const text = document.getElementById('submit-text');
      try { let saved = localStorage.getItem('perfect_login_username'); if (saved) {username.value = saved;remember.checked = true;} } catch (_) {}
      const status = (message, info=false) => { notice.textContent=message;notice.className='notice show'+(info?' info':''); };
      const clearStatus = () => {notice.textContent='';notice.className='notice';};
      username.addEventListener('input',clearStatus);
      password.addEventListener('input',clearStatus);
      toggle.addEventListener('click', () => {
        const visible = password.type === 'password';
        password.type = visible ? 'text' : 'password';
        toggle.setAttribute('aria-label',visible?'Skrýt heslo':'Zobrazit heslo');
        toggle.setAttribute('title',visible?'Skrýt heslo':'Zobrazit heslo');
        toggle.setAttribute('aria-pressed',String(visible));
        password.focus({preventScroll:true});
      });
      document.getElementById('forgot').addEventListener('click', () => {
        const dlg = document.getElementById('recovery-dialog');
        if (typeof dlg.showModal === 'function') dlg.showModal();
        else alert('O změnu hesla požádejte správce systému Automyčka PERFECT.');
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();clearStatus();
        const u = username.value.trim();const p = password.value;
        if (!u) { status('Vyplňte uživatelské jméno.');username.focus();return; }
        if (!p) { status('Vyplňte heslo.');password.focus();return; }
        // NEVER store a password in localStorage, sessionStorage or the URL.
        try { if (remember.checked) localStorage.setItem('perfect_login_username',u); else localStorage.removeItem('perfect_login_username'); } catch (_) {}
        /*
         * CONNECTING EXISTING PERFECT BACKEND:
         * Provide window.PERFECT_LOGIN_HANDLER = async ({username,password,remember}) =>
         *   { ok: true } for success or { ok: false, message: '...' } for failure.
         * Call the EXISTING server-side authentication flow and handle its real
         * token/session/navigation there. Never bypass server authorization.
         * The standalone preview deliberately cannot authenticate.
         */
        if (typeof window.PERFECT_LOGIN_HANDLER !== 'function') {
          status('Toto je samostatný HTML náhled. Skutečné přihlášení bude aktivní po napojení na zabezpečení PERFECT.',true);return;
        }
        submitButton.disabled=true;text.textContent='Přihlašování…';
        try {
          const result = await window.PERFECT_LOGIN_HANDLER({username:u,password:p,remember:remember.checked});
          if (result && result.ok === true) {
            clearStatus();
            if (typeof window.PERFECT_ON_LOGIN_SUCCESS === 'function') await window.PERFECT_ON_LOGIN_SUCCESS(result);
            else status('Přihlášení potvrzeno. Přechod do aplikace musí dokončit integrace PERFECT.',true);
          } else status((result && typeof result.message === 'string' && result.message) || 'Přihlášení se nezdařilo. Zkontrolujte údaje.');
        } catch (_) {status('Přihlášení momentálně není dostupné. Zkuste to později.');}
        finally {submitButton.disabled=false;text.textContent='Přihlásit se';}
      });
    })();
  </script>
