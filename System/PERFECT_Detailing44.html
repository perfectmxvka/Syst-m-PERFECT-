<script>
const PerfectDetail44=(()=>{
 let items=[],settings={},requestEpoch=0,currentTab='orders',query='',filter='all';
 const call=(name,args=[])=>new Promise((ok,no)=>api(name,args,ok,no));
 const can=k=>window.PerfectAccess40?.can(k)===true;
 const dt=s=>s?new Date(String(s).slice(0,10)+'T12:00:00Z').toLocaleDateString('cs-CZ',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Prague'}):'—';
 const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague'}).format(new Date());
 const days=s=>s?Math.round((Date.parse(s+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000):null;
 function badge(d){const n=days(d.checkDate);return n===null?'':`<span class="d44-due ${n<0?'d44-overdue':''}">${n<0?'Po termínu '+Math.abs(n)+' dnů':n===0?'Kontrola dnes':'Za '+n+' dnů'}</span>`;}
 function rows(){const q=normalize(query);return items.filter(x=>{const o=x.order,d=x.detail;return normalize([o.ORDER_ID,o.JMENO_PRIJMENI,o.TELEFON,o.EMAIL,o.VOZIDLO,o.SPZ,d.vin].join(' ')).includes(q)&&(filter==='all'||filter==='soon'&&days(d.checkDate)!==null&&days(d.checkDate)<=7||String(d.protectionYears)===filter);}).sort((a,b)=>String(b.order.ORDER_ID).localeCompare(String(a.order.ORDER_ID),undefined,{numeric:true}));}
 function syncOrder(o){const i=state.orders.findIndex(x=>x.ORDER_ID===o.ORDER_ID);if(i<0)state.orders.push(o);else state.orders[i]=o;}
 function draw(){if(state.page!=='detailing')return;const create=can('orders.create')&&can('prices.edit');app.innerHTML=`<div class="d44 d44-enter"><section class="d44-hero"><div class="d44-kicker">AUTOMYČKA PERFECT · DETAILING STUDIO</div><h2>Detailing <span>PRO</span></h2><p>Prémiová péče o vůz. Zakázky, keramická ochrana a fotodokumentace na jednom místě.</p><div class="d44-tools">${create?'<button class="btn" data-d44-new>＋ Nová zakázka</button>':''}<button class="btn secondary" data-d44-refresh>↻ Obnovit data</button></div></section><nav class="d44-tabs" aria-label="Detailing"><button class="btn ${currentTab==='orders'?'':'secondary'}" data-d44-tab="orders">Zakázky</button><button class="btn ${currentTab==='services'?'':'secondary'}" data-d44-tab="services">Ceník služeb</button></nav><div data-d44-content></div></div>`;
 app.querySelector('[data-d44-new]')?.addEventListener('click',()=>edit());app.querySelector('[data-d44-refresh]').onclick=()=>load();app.querySelectorAll('[data-d44-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.d44Tab;draw();});
 if(currentTab==='services'){const root=app;renderDetailingLegacy44(false);const content=app.innerHTML;drawShellServices(content);return;}
 const soon=items.filter(x=>days(x.detail.checkDate)!==null&&days(x.detail.checkDate)>=0&&days(x.detail.checkDate)<=7).length;app.querySelector('[data-d44-content]').innerHTML=`<div class="d44-summary"><div class="d44-metric"><small>DETAILINGOVÉ ZAKÁZKY</small><strong>${items.length}</strong></div><div class="d44-metric"><small>KONTROLA DO 7 DNŮ</small><strong>${soon}</strong></div><div class="d44-metric"><small>KERAMICKÁ OCHRANA</small><strong>${items.filter(x=>x.detail.protectionYears).length}</strong></div></div><section><h3>Přehled detailingových zakázek</h3><div class="d44-tools"><input class="field" data-d44-search aria-label="Hledat detailing" placeholder="Zakázka, SPZ, zákazník, telefon…" value="${esc(query)}"><select class="field" data-d44-filter aria-label="Filtr ochrany"><option value="all">Všechny zakázky</option><option value="soon">Kontrola do 7 dnů / po termínu</option><option value="3">Ochrana 3 roky</option><option value="5">Ochrana 5 let</option></select><button class="btn secondary" data-d44-export>Export CSV</button></div><div data-d44-rows></div></section><div class="d44-note"><b>7 dní před kontrolou → rabitensro@gmail.com</b><br>E-mail obsahuje zákazníka, kontakt, vozidlo, ochranu a termín kontroly.<div class="d44-status" data-d44-mail-status></div>${can('roles.manage')?'<button class="btn secondary small" style="margin-top:10px" data-d44-config></button><button class="btn secondary small" style="margin:10px 0 0 8px" data-d44-history>Historie odesílání</button>':''}</div>`;
 const search=app.querySelector('[data-d44-search]'),sel=app.querySelector('[data-d44-filter]');sel.value=filter;search.oninput=()=>{query=search.value;drawRows();};sel.onchange=()=>{filter=sel.value;drawRows();};app.querySelector('[data-d44-export]').onclick=exportCSV;drawRows();mailStatus();
 }
 function drawShellServices(content){app.innerHTML=`<div class="d44"><nav class="d44-tabs"><button class="btn secondary" data-d44-back>← Detailingové zakázky</button></nav>${content}</div>`;app.querySelector('[data-d44-back]').onclick=()=>{currentTab='orders';draw();};app.querySelector('.d44>section:last-child')?.remove();}
 function drawRows(){const list=rows(),area=app.querySelector('[data-d44-rows]');if(!area)return;area.innerHTML=!list.length?'<div class="d44-info">Žádné zakázky neodpovídají výběru.</div>':`<div class="d44-table"><table><thead><tr><th>Číslo zakázky</th><th>Vozidlo / SPZ</th><th>Zákazník / Kontakt</th><th>Ochrana</th><th>Aplikace</th><th>Kontrola</th><th>Obnova</th><th>Celkem</th><th>Karta vozidla</th></tr></thead><tbody>${list.map(x=>{const o=x.order,d=x.detail;return `<tr><td>${orderIdMarkup(o.ORDER_ID)}</td><td><div class="vehicle-brand-cell">${vehicleLogoMarkup(o.VOZIDLO)}<b>${esc(o.VOZIDLO)}</b></div><small>${esc(o.SPZ||'SPZ neuvedena')}</small></td><td><b>${esc(o.JMENO_PRIJMENI)}</b><small>${esc(o.TELEFON)}<br>${esc(o.EMAIL||'E-mail neuveden')}</small></td><td>${d.protectionYears?d.protectionYears+' '+(d.protectionYears===3?'roky':'let'):'Bez keramiky'}</td><td>${dt(d.applicationDate)}</td><td>${dt(d.checkDate)}<br>${badge(d)}</td><td>${dt(d.renewalDate)}</td><td><b style="color:#e6c76e">${money(o.CENA_CELKEM)}</b></td><td><button class="btn secondary small" data-d44-open="${esc(o.ORDER_ID)}">Otevřít kartu</button></td></tr>`;}).join('')}</tbody></table></div><div class="d44-mobile-list">${list.map(x=>{const o=x.order,d=x.detail;return `<article class="d44-card"><div style="display:flex;justify-content:space-between;gap:12px">${orderIdMarkup(o.ORDER_ID)}${d.protectionYears?`<span class="pill">Ochrana ${d.protectionYears} ${d.protectionYears===3?'roky':'let'}</span>`:''}</div><h3>${vehicleLogoMarkup(o.VOZIDLO)}${esc(o.VOZIDLO)}</h3><div class="d44-contact">${esc(o.SPZ||'SPZ neuvedena')}<br><b>${esc(o.JMENO_PRIJMENI)}</b><br>${esc(o.TELEFON)}<br>${esc(o.EMAIL||'E-mail neuveden')}</div><div class="d44-dates"><div><small>APLIKACE</small><b>${dt(d.applicationDate)}</b></div><div><small>KONTROLA</small><b>${dt(d.checkDate)}</b>${badge(d)}</div><div><small>OBNOVA</small><b>${dt(d.renewalDate)}</b></div></div><div class="d44-card-foot"><strong>${money(o.CENA_CELKEM)}</strong><button class="btn" data-d44-open="${esc(o.ORDER_ID)}">Otevřít kartu ↗</button></div></article>`;}).join('')}</div>`;area.querySelectorAll('[data-d44-open]').forEach(b=>b.onclick=()=>open(b.dataset.d44Open));}
 function mailStatus(){const el=app.querySelector('[data-d44-mail-status]');if(!el)return;el.textContent=(settings.testMode?'Testovací kopie: e-maily vypnuté.':settings.enabled?'Připomínky zapnuté.':'Připomínky vypnuté — nejdřív je zapni.')+(settings.lastRun?' Poslední běh: '+new Date(settings.lastRun).toLocaleString('cs-CZ')+'.':'')+(settings.unconfirmed?' Nepotvrzené zprávy: '+settings.unconfirmed+'. Ověř historii odesílání.':'')+(settings.lastError?' Pozor: '+settings.lastError:'');app.querySelector('[data-d44-history]')?.addEventListener('click',mailHistory);const b=app.querySelector('[data-d44-config]');if(b){b.textContent=settings.enabled?'Vypnout připomínky':'Zapnout připomínky';b.onclick=async()=>{b.disabled=true;try{const r=await call('perfectDetail44Configure',[{enabled:!settings.enabled}]);settings=r.settings;mailStatus();}catch(e){el.textContent=e.message;}finally{b.disabled=false;}};}}
 async function load(){const epoch=++requestEpoch;if(!can('orders.read')){app.innerHTML='<div class="notice">Nemáš povolené zobrazení zakázek.</div>';return;}app.innerHTML='<div class="d44 d44-loading">Načítám detailingové zakázky…</div>';try{const r=await call('perfectDetail44List');if(epoch!==requestEpoch||state.page!=='detailing'||!perfectAuthUser)return;items=r.items;settings=r.settings;draw();}catch(e){if(epoch!==requestEpoch||state.page!=='detailing')return;app.innerHTML='<section class="d44 d44-info"><h3>Detailing se nepodařilo načíst</h3><p>'+esc(e.message)+'</p><button class="btn" data-d44-retry>Zkusit znovu</button></section>';app.querySelector('button').onclick=load;}}
 const modals=new Set();const oldShowLogin44=showLogin;showLogin=function(...args){requestEpoch++;items=[];settings={};modals.forEach(m=>m.destroy());modals.clear();return oldShowLogin44(...args);};const oldLogout44=perfectLogout;perfectLogout=function(){requestEpoch++;items=[];settings={};modals.forEach(m=>m.destroy());modals.clear();return oldLogout44();};window.perfectLogout=perfectLogout;
 function modal(title){const el=document.createElement('div');el.className='overlay d44';el.innerHTML=`<section class="modal d44-modal d44-enter" role="dialog" aria-modal="true" aria-labelledby="d44-title"><div class="modal-head"><div><div class="d44-kicker">PERFECT · DETAILING</div><h2 id="d44-title">${title}</h2></div><button class="close" aria-label="Zavřít" type="button">×</button></div><div data-d44-body></div></section>`;const prev=document.activeElement;let busy=false;const close=()=>{if(busy)return;el.remove();document.removeEventListener('keydown',key);modals.delete(entry);prev?.focus?.();};const key=e=>{if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();close();}if(e.key==='Tab'){const f=[...el.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&!x.hidden),i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f.at(-1)?.focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0]?.focus();}}};document.addEventListener('keydown',key);el.querySelector('.close').onclick=close;el.onclick=e=>{if(e.target===el)close();};document.body.append(el);el.querySelector('.close').focus();const entry={el,body:el.querySelector('[data-d44-body]'),close,destroy:()=>{busy=false;close();},setBusy:v=>{busy=v;el.querySelector('.close').disabled=v;}};modals.add(entry);return entry;}
 async function open(id){const m=modal(orderIdMarkup(id)+' · Karta vozidla');m.body.innerHTML='<p>Načítám kartu…</p>';try{const r=await call('perfectDetail44Get',[id]);if(!m.el.isConnected)return;const o=r.order,d=r.detail,info=(title,fields)=>`<section class="d44-info"><h3>${title}</h3><dl>${fields.map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1]||'—')}</dd>`).join('')}</dl></section>`;m.body.innerHTML=`<div class="d44-tools"><h3 style="margin:0;flex:1">${esc(o.VOZIDLO)}</h3>${can('orders.edit')?'<button class="btn" data-d44-edit>Upravit zakázku</button>':''}<button class="btn secondary" data-d44-car>Původní karta vozidla ↗</button></div><div class="d44-grid">${info('Zákazník / Kontakt',[['Jméno',o.JMENO_PRIJMENI],['Telefon',o.TELEFON],['E-mail',o.EMAIL],['Firma',o.FIRMA]])}${info('Vozidlo',[['Model',o.VOZIDLO],['SPZ',o.SPZ],['VIN',d.vin],['Rok',d.year],['Barva',d.color]])}${info('Keramická ochrana',[['Doba ochrany',d.protectionYears?d.protectionYears+' roky/let':'Bez ochrany'],['Aplikace',dt(d.applicationDate)],['Kontrola',dt(d.checkDate)],['Obnova',dt(d.renewalDate)]])}<section class="d44-info"><h3>Služby a cena</h3><p style="white-space:pre-wrap">${esc(o.MYCI_PROGRAM)}</p><div class="d44-total">${money(o.CENA_CELKEM)}</div><p>${statusPill(o.STAV_OBJEDNAVKY)}</p></section></div>${d.notes?'<section class="d44-info"><h3>Poznámky k vozidlu a práci</h3><p style="white-space:pre-wrap">'+esc(d.notes)+'</p></section>':''}${['before','after'].map(phase=>`<section class="d44-gallery"><h3>${phase==='before'?'PŘED PRACÍ':'PO PRÁCI'} · 5 fotografií</h3><div class="d44-photo-strip">${[1,2,3,4,5].map(n=>`<div class="d44-photo" data-d44-slot="${phase+n}"><button type="button" aria-label="Zobrazit fotografii ${phase==='before'?'před':'po'} práci ${n}">Bez fotografie</button><span class="d44-number">${n}</span>${can('media.write')&&can('orders.edit')?'<label>Nahrát / změnit<input type="file" accept="image/jpeg,image/png,image/webp" aria-label="Nahrát fotografii '+n+'"></label>':''}</div>`).join('')}</div></section>`).join('')}<p class="d44-status" data-d44-photo-status role="status">${can('media.read')?'Načítám fotografie…':'Zobrazení fotografií není pro tvůj účet povolené.'}</p><div class="d44-note">${d.reminderEnabled?'Připomínka kontroly požadována pro '+dt(d.checkDate)+'.':'U této zakázky je připomínka vypnutá.'} ${settings.enabled?'':'Globální odesílání musí být zapnuté v přehledu detailingu.'}</div>`;m.body.querySelector('[data-d44-edit]')?.addEventListener('click',()=>{m.close();edit(id,r);});m.body.querySelector('[data-d44-car]').onclick=()=>{m.close();showVehicleDetail(o.VEHICLE_ID);};
 let uploading=false;const ids=new Map(),data=new Map(),status=m.body.querySelector('[data-d44-photo-status]');
