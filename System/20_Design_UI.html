<script>
/* Standalone presentation module. All persistence is delegated to connect(). */
(function(){'use strict';
const q=(s,r=document)=>r.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'');
const money=v=>Number(v||0).toLocaleString('cs-CZ',{maximumFractionDigits:2})+' Kč';
const date=v=>{if(!v)return '—';const d=new Date(String(v).slice(0,10)+'T12:00:00');return isNaN(d)?String(v):d.toLocaleDateString('cs-CZ')};
const safeImage=v=>typeof v==='string'&&(/^(data:image\/(png|jpeg|webp);base64,)/.test(v)||/^https:\/\//.test(v))?v:'';
let adapter={},cache=new Map();const data=()=>adapter.getData?.()||{customers:[],vehicles:[],orders:[]};
const ordersFor=(key,id)=>(data().orders||[]).filter(o=>String(o[key])===String(id));
const avatar=(url,name='',cls='')=>safeImage(url)?`<img class="pd-avatar ${cls}" src="${esc(safeImage(url))}" alt="${esc(name)}" loading="lazy">`:`<span class="pd-avatar pd-avatar-empty ${cls}" aria-label="Bez fotografie">${esc(name.slice(0,1)||'＋')}</span>`;
const imageFor=(kind,id,slot='profile')=>cache.get(kind+':'+id+':'+slot)||'';
const status=s=>`<span class="pill ${/dokon|vyhot/i.test(norm(s))?'good':/ceka/i.test(norm(s))?'warn':/nedor|zrus/i.test(norm(s))?'pd-status-bad':''}">${esc(s||'—')}</span>`;
function modal(title,html){const old=document.activeElement,el=document.createElement('div');el.className='overlay';el.innerHTML=`<div class="modal pd-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="pd-kicker">AUTOMYČKA PERFECT</div><h2>${esc(title)}</h2></div><button type="button" class="close" aria-label="Zavřít">×</button></div>${html}</div>`;document.body.append(el);let busy=0;const close=()=>{if(busy)return;el.remove();document.removeEventListener('keydown',key);old?.focus()};const key=e=>{if(document.querySelector('.overlay:last-of-type')!==el)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const a=[...el.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.offsetParent);if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}};document.addEventListener('keydown',key);q('.close',el).onclick=close;el.onclick=e=>{if(e.target===el)close()};q('.close',el).focus();return {el,close,busy:v=>{busy+=v?1:-1;q('.close',el).disabled=busy>0}}}
function history(rows){return rows.length?`<div class="table-wrap pd-history"><table><thead><tr><th>Zakázka</th><th>Datum / čas</th><th>Vozidlo</th><th>Program</th><th>Cena</th><th>Stav</th></tr></thead><tbody>${[...rows].sort((a,b)=>String(b.DATUM_OBJEDNANI).localeCompare(String(a.DATUM_OBJEDNANI))).map(o=>`<tr><td style="color:${String(o.ORDER_ID).startsWith('OF')?'#ffb347':'#52b8ff'}">${esc(o.ORDER_ID)}</td><td>${esc(date(o.DATUM_OBJEDNANI))}<br><small class="muted">${esc(o.CAS_PRIJEZDU||'—')}</small></td><td>${esc(o.VOZIDLO)}</td><td>${esc(o.MYCI_PROGRAM)}</td><td>${money(o.CENA_CELKEM)}</td><td>${status(o.STAV_OBJEDNAVKY)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="pd-empty">Zatím žádné propojené zakázky.</div>'}
async function compress(file,slot){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Vyber JPG, PNG nebo WebP.');if(file.size>12*1024*1024)throw Error('Maximum je 12 MB.');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('Obrázek nelze načíst.'));img.src=url});const max=slot==='profile'?600:1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let out=c.toDataURL('image/jpeg',.82);if(out.length>1600000)out=c.toDataURL('image/jpeg',.65);if(out.length>2000000)throw Error('Fotografie je po zmenšení stále příliš velká.');return out}finally{URL.revokeObjectURL(url)}}
function photoMarkup(kind,id,slot,label){return `<div class="pd-photo" data-kind="${esc(kind)}" data-id="${esc(id)}" data-slot="${esc(slot)}"><div class="pd-photo-image">${avatar(imageFor(kind,id,slot))}</div><button class="btn secondary" type="button" data-upload>${esc(label)}</button><input type="file" accept="image/jpeg,image/png,image/webp" aria-label="${esc(label)}"><div class="message" role="status"></div></div>`}
function bindPhotos(dialog){dialog.el.querySelectorAll('.pd-photo').forEach(box=>{const {kind,id,slot}=box.dataset,button=q('[data-upload]',box),input=q('input',box),msg=q('.message',box);button.onclick=()=>input.click();q('.pd-photo-image',box).onclick=()=>{const src=imageFor(kind,id,slot);if(!src)return;const m=modal('Fotografie',`<img src="${esc(src)}" alt="Fotografie vozidla nebo zákazníka" style="width:100%;max-height:75vh;object-fit:contain">`);m.el.classList.add('pd-lightbox')};input.onchange=async()=>{const file=input.files[0];if(!file)return;button.disabled=true;dialog.busy(true);msg.textContent='Zpracovávám fotografii…';try{if(typeof adapter.savePhoto!=='function')throw Error('Ukládání fotografií ještě není připojené k backendu.');const encoded=await compress(file,slot);msg.textContent='Ukládám fotografii…';const result=await adapter.savePhoto({kind,id,slot,dataUrl:encoded});if(result?.success!==true)throw Error(result?.message||'Server nepotvrdil uložení fotografie.');cache.set(kind+':'+id+':'+slot,safeImage(result.dataUrl)||encoded);q('.pd-photo-image',box).innerHTML=avatar(imageFor(kind,id,slot));msg.textContent='Fotografie uložena.';adapter.onPhotoSaved?.({kind,id,slot});}catch(e){msg.textContent=e.message}finally{button.disabled=false;dialog.busy(false);input.value=''}}})}
async function loadPhotos(kind,id,root){if(typeof adapter.loadPhotos!=='function')return;try{const result=await adapter.loadPhotos({kind,id});if(!result||result.success!==true)throw Error(result?.message||'Fotografie se nepodařilo načíst.');Object.entries(result.photos||{}).forEach(([slot,url])=>{if(safeImage(url))cache.set(kind+':'+id+':'+slot,url)});if(root?.isConnected)root.querySelectorAll('.pd-photo').forEach(b=>q('.pd-photo-image',b).innerHTML=avatar(imageFor(kind,id,b.dataset.slot)))}catch(e){if(root?.isConnected){const m=root.querySelector('.message');if(m)m.textContent='Načtení fotografií: '+e.message}}}
function openCustomer(id){const d=data(),c=d.customers.find(c=>String(c.CUSTOMER_ID||c.ID)===String(id));if(!c)return;const rows=ordersFor('CUSTOMER_ID',id),cars=d.vehicles.filter(v=>String(v.CUSTOMER_ID)===String(id)),programs={};rows.forEach(o=>programs[o.MYCI_PROGRAM]=(programs[o.MYCI_PROGRAM]||0)+1);const favorite=Object.entries(programs).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';const m=modal('Karta zákazníka',`<div class="pd-profile">${photoMarkup('customer',id,'profile','Změnit profilovou fotku')}<div><div class="pd-kicker">Zákazník · ${esc(id)}</div><h2>${esc(c.JMENO_PRIJMENI||c.NAZEV)}</h2><p>${esc(c.TELEFON||'Telefon neuveden')}<br>${esc(c.EMAIL||'E-mail neuveden')}</p></div></div><div class="profile-grid"><div class="profile-stat"><small>Celkem návštěv</small><b>${rows.length}</b></div><div class="profile-stat"><small>Celková útrata</small><b>${money(rows.reduce((s,o)=>s+Number(o.CENA_CELKEM||0),0))}</b></div><div class="profile-stat"><small>Nejoblíbenější program</small><b>${esc(favorite)}</b></div></div><div class="pd-dialog-columns"><section class="section"><h3>Vozidla zákazníka · ${cars.length}</h3>${cars.map(v=>`<div class="service"><div>${esc(v.VOZIDLO)}<br><small class="muted">${esc(v.SPZ||'')}</small></div><button class="btn secondary small" data-car="${esc(v.VEHICLE_ID)}">Detail</button></div>`).join('')||'<div class="pd-empty">Žádná vozidla</div>'}</section><section class="section"><h3>Historie objednávek</h3>${history(rows)}</section></div>`);m.el.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>openVehicle(b.dataset.car));bindPhotos(m);loadPhotos('customer',id,m.el)}
function openVehicle(id){const d=data(),v=d.vehicles.find(v=>String(v.VEHICLE_ID)===String(id));if(!v)return;const c=d.customers.find(c=>String(c.CUSTOMER_ID)===String(v.CUSTOMER_ID));const m=modal('Detail vozu',`<div class="pd-profile">${photoMarkup('vehicle',id,'profile','Změnit profilovou fotku')}<div><div class="pd-kicker">Vozidlo · ${esc(id)}</div><h2>${esc(v.VOZIDLO||'Vozidlo')}</h2><span class="pd-plate">${esc(v.SPZ||'SPZ neuvedena')}</span><p>Zákazník: ${esc(c?.JMENO_PRIJMENI||'—')}<br>VIN: ${esc(v.VIN||'Neuvedeno')}</p></div></div><h3>Galerie vozidla <span class="muted">· 5 fotografií navíc</span></h3><div class="pd-gallery">${Array.from({length:5},(_,i)=>photoMarkup('vehicle',id,'gallery'+(i+1),'Přidat / změnit '+(i+1))).join('')}</div><section class="section"><h3>Historie péče o vůz</h3>${history(ordersFor('VEHICLE_ID',id))}</section>`);bindPhotos(m);loadPhotos('vehicle',id,m.el)}
function customers(root){const d=data();let page=1,query='',sort='name';root.innerHTML=`<section class="section"><div class="pd-section-head"><div><div class="pd-kicker">Evidence</div><h2>Zákazníci</h2><p class="muted">Kompletní seznam zákazníků s přehledem návštěv</p></div><input class="field search" id="pd-search" placeholder="Jméno, telefon, e-mail nebo SPZ…" aria-label="Hledat zákazníka"><select class="field" id="pd-sort" style="width:auto" aria-label="Řazení"><option value="name">Jméno A–Z</option><option value="visits">Počet návštěv</option><option value="last">Poslední návštěva</option></select></div><div id="pd-table"></div><div class="pd-pagination"><span class="muted" id="pd-count"></span><div><button class="btn secondary small" id="pd-prev">←</button> <span id="pd-page"></span> <button class="btn secondary small" id="pd-next">→</button></div></div></section>`;
const enriched=d.customers.map(c=>{const id=c.CUSTOMER_ID||c.ID,rows=ordersFor('CUSTOMER_ID',id),cars=d.vehicles.filter(v=>String(v.CUSTOMER_ID)===String(id));return{c,id,rows,last:rows.map(o=>o.DATUM_OBJEDNANI).sort().at(-1)||'',search:norm([c.JMENO_PRIJMENI,c.NAZEV,c.TELEFON,c.EMAIL,...cars.map(v=>v.SPZ)].join(' '))}});
function draw(){const list=enriched.filter(x=>x.search.includes(norm(query))).sort((a,b)=>sort==='visits'?b.rows.length-a.rows.length:sort==='last'?b.last.localeCompare(a.last):String(a.c.JMENO_PRIJMENI||a.c.NAZEV).localeCompare(String(b.c.JMENO_PRIJMENI||b.c.NAZEV),'cs'));const pages=Math.max(1,Math.ceil(list.length/20));page=Math.min(page,pages);q('#pd-table',root).innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>Profil</th><th>Jméno a příjmení</th><th>Kontakt</th><th>E-mail</th><th>Počet návštěv</th><th>Poslední návštěva</th><th>Otevřít kartu zákazníka</th></tr></thead><tbody>${list.slice((page-1)*20,page*20).map(x=>`<tr><td>${avatar(imageFor('customer',x.id)||x.c.PROFILE_PHOTO_URL,x.c.JMENO_PRIJMENI||'')}</td><td>${esc(x.c.JMENO_PRIJMENI||x.c.NAZEV)}</td><td>${esc(x.c.TELEFON||'—')}</td><td>${esc(x.c.EMAIL||'—')}</td><td>${x.rows.length}</td><td>${esc(date(x.last))}</td><td><button class="customer-open" data-customer="${esc(x.id)}">◉ Otevřít kartu zákazníka</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="pd-empty">Žádný zákazník neodpovídá hledání.</div>';q('#pd-count',root).textContent=`Zobrazeno ${list.length?(page-1)*20+1:0}–${Math.min(page*20,list.length)} z ${list.length} zákazníků`;q('#pd-page',root).textContent=`${page} / ${pages}`;q('#pd-prev',root).disabled=page===1;q('#pd-next',root).disabled=page===pages;root.querySelectorAll('[data-customer]').forEach(b=>b.onclick=()=>{if(confirm('Otevřít kartu vybraného zákazníka?'))openCustomer(b.dataset.customer)})}q('#pd-search',root).oninput=e=>{query=e.target.value;page=1;draw()};q('#pd-sort',root).onchange=e=>{sort=e.target.value;draw()};q('#pd-prev',root).onclick=()=>{page--;draw()};q('#pd-next',root).onclick=()=>{page++;draw()};draw()}
function dashboard(root){const d=data(),checks=(d.checks||[]).filter(x=>x.dueDate).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))).slice(0,5),today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),rows=d.orders.filter(o=>String(o.DATUM_OBJEDNANI).slice(0,10)===today).sort((a,b)=>String(a.CAS_PRIJEZDU).localeCompare(String(b.CAS_PRIJEZDU)));
root.innerHTML=`<section class="section"><div class="pd-section-head"><div><div class="pd-kicker">Následná péče</div><h3>◷ &nbsp; 5 nejbližších kontrol / expirací</h3></div></div>${checks.length?`<div class="pd-five">${checks.map(x=>{const days=Math.ceil((new Date(x.dueDate+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);return `<article class="pd-expiry" data-urgency="${days<=3?'urgent':days<=12?'soon':'normal'}"><span class="pill">${days<0?'PO TERMÍNU':days===0?'DNES':'ZA '+days+' DNÍ'}</span>${safeImage(x.photo)?`<img src="${esc(x.photo)}" alt="${esc(x.vehicle)}">`:'<div class="pd-car-empty">▱</div>'}<h3>${esc(x.vehicle)}</h3><span class="pd-plate">${esc(x.plate||'—')}</span><p>${esc(x.service||'Kontrola ochrany')}<br>${esc(date(x.dueDate))}<br>${esc(x.customer||'')}</p><button class="btn secondary small" data-vehicle="${esc(x.vehicleId)}">Detail vozu →</button></article>`}).join('')}</div>`:`<div class="pd-empty">${d.checks===undefined?'Přehled kontrol čeká na připojení dat o termínech.':'Žádné naplánované kontroly ani expirace.'}</div>`}</section><div class="pd-stats">${[['Zakázky',d.orders.length,'▤'],['Vozidla',d.vehicles.length,'▱'],['Zákazníci',d.customers.length,'♙']].map(([n,v,i])=>`<div class="card pd-stat"><span class="pd-stat-icon">${i}</span><div><small>${n}</small><div class="number">${v}</div><span class="muted">Celkem v evidenci</span></div></div>`).join('')}</div><div class="columns"><section class="section"><div class="pd-section-head"><h3>Dnešní program</h3><button class="btn secondary small" data-go="calendar">Kalendář →</button></div>${history(rows)}</section><section class="section"><h3>Rychlé akce</h3><div class="pd-actions"><button class="btn" data-new>＋ Nová zakázka<small>Vytvořit novou objednávku</small></button><button class="btn secondary" data-go="customers">⌕ Vyhledat zákazníka<small>Hledání v databázi</small></button><button class="btn secondary" data-go="calendar">▦ Zobrazit kalendář<small>Přehled rezervací</small></button><button class="btn secondary" data-go="services">⚙ Služby a ceník<small>Programy a ceny</small></button></div></section></div>`;root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>adapter.navigate?.(b.dataset.go));q('[data-new]',root).onclick=()=>adapter.newOrder?.();root.querySelectorAll('[data-vehicle]').forEach(b=>b.onclick=()=>openVehicle(b.dataset.vehicle))}
function init(){const assets=window.PerfectDesignAssets||{};const side=q('.brand-lockup');if(side)side.innerHTML=`<img class="pd-brand-side" src="${esc(assets.stacked||'')}" alt="Automyčka PERFECT">`;const brand=q('.auth-brand');if(brand)brand.innerHTML=`<img class="pd-auth-logo" src="${esc(assets.stacked||'')}" alt="Automyčka PERFECT">`;const top=q('.top');if(top){const header=document.createElement('div');header.className='pd-section-head';header.innerHTML=`<img class="pd-brand-header" src="${esc(assets.horizontal||'')}" alt="Automyčka PERFECT"><div class="pd-clock"></div>`;top.before(header);const clock=()=>{const n=new Date();q('.pd-clock',header).innerHTML=`<strong>${n.toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Prague'})}</strong><small>${n.toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Prague'})}</small>`};clock();setInterval(clock,30000)}
const toggle=q('#perfectMobileMenuToggle'),backdrop=q('#perfectMobileMenuBackdrop'),aside=q('#perfectSidebar');if(toggle&&aside){const set=open=>{document.body.classList.toggle('pd-menu-open',open);toggle.setAttribute('aria-expanded',String(open));aside.inert=!open;aside.setAttribute('aria-hidden',String(!open));if(open)q('button',aside)?.focus();else toggle.focus()};aside.inert=true;aside.setAttribute('aria-hidden','true');toggle.onclick=()=>set(!document.body.classList.contains('pd-menu-open'));if(backdrop)backdrop.onclick=()=>set(false);aside.addEventListener('click',e=>{if(e.target.closest('button'))set(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('pd-menu-open'))set(false)});const gate=q('#authGate');if(gate){const sync=()=>{toggle.style.visibility=gate.style.display==='none'?'visible':'hidden';if(gate.style.display!=='none')document.body.classList.remove('pd-menu-open')};new MutationObserver(sync).observe(gate,{attributes:true,attributeFilter:['style']});sync()}}
const pass=q('#authForm input[name=password]');if(pass){const btn=document.createElement('button');btn.type='button';btn.className='pd-password-toggle';btn.textContent='Zobrazit heslo';btn.onclick=()=>{pass.type=pass.type==='password'?'text':'password';btn.textContent=pass.type==='password'?'Zobrazit heslo':'Skrýt heslo'};pass.after(btn)}const error=q('#authError');if(error)error.setAttribute('role','alert')}
window.PerfectDesign={version:'1.0.0',connect:a=>{adapter=a||{};cache.clear()},dashboard,customers,openCustomer,openVehicle,init,clearPhotos:()=>cache.clear()};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
