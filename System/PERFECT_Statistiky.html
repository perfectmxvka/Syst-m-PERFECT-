<script>
/* Celé rozšíření patří do HTML souboru PERFECT_Statistiky. */
(()=>{
 let report=null,tab='earnings',month='',selectedDay='',employee='all',requestId=0,legacyHtml='',boxChoice=null,boxDetail=null,boxRequest=0,dayOverlay=null,dayRequest=0,dayLastFocus=null;
 const rootId='perfectReports39',admin=()=>window.PerfectAccess40?.can(['finance.read','payroll.read']),can=cap=>window.PerfectAccess40?.can(cap);
 const e=s=>esc(s==null?'':String(s)),cash=n=>money(Number(n)||0),station=s=>({BOX1:'Box 1',BOX2:'Box 2',DETAILING:'Detailing'}[s]||s);
 const stationValue=(summary,key)=>summary?.stations?.find(s=>s.station===key)?.revenue||0;
 const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const range=x=>x?dateText(x.from)+' – '+dateText(x.to):'—';
 function delta(value){if(!value)return '—';const c=value.amount>0?'r39-up':value.amount<0?'r39-down':'';return `<span class="${c}">${value.amount>0?'+':''}${cash(value.amount)}${value.percent===null?' · základ 0 Kč':' ('+(value.percent>0?'+':'')+e(value.percent)+' %)'}</span>`;}
 const card=(label,value,detail='')=>`<article class="r39-card"><small>${e(label)}</small><strong class="r39-value">${value}</strong><div class="r39-muted">${detail}</div></article>`;
 function chart(labels,series,title){
  const values=series.flatMap(s=>s.values.filter(v=>v!==null&&Number.isFinite(v))),minimum=Math.min(0,...values),maximum=Math.max(1,...values),span=maximum-minimum;
  const width=880,height=240,left=68,right=18,top=14,bottom=42,plot=height-top-bottom;
  const x=i=>left+(width-left-right)*(labels.length===1?.5:i/(labels.length-1)),y=v=>top+(maximum-v)/span*plot;
  let svg=`<svg class="r39-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${e(title)}">`;
  for(let n=0;n<=4;n++){const amount=minimum+span*n/4,yy=y(amount);svg+=`<line x1="${left}" y1="${yy}" x2="${width-right}" y2="${yy}" stroke="#34343d"/><text x="${left-8}" y="${yy+4}" fill="#9d9daa" font-size="11" text-anchor="end">${e(Math.round(amount).toLocaleString('cs-CZ'))}</text>`;}
  labels.forEach((label,i)=>{if(labels.length<14||i%3===0||i===labels.length-1)svg+=`<text x="${x(i)}" y="${height-15}" fill="#a6a6b1" font-size="10" text-anchor="middle">${e(label)}</text>`;});
  series.forEach(s=>{let path='',down=false;s.values.forEach((v,i)=>{if(v===null){down=false;return;}path+=(down?' L':' M')+x(i)+','+y(v);down=true;});svg+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.7" ${s.dashed?'stroke-dasharray="5 5"':''}/>`;s.values.forEach((v,i)=>{if(v!==null)svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.4" fill="${s.color}"><title>${e(labels[i]+': '+s.name+' '+cash(v))}</title></circle>`;});});
  svg+='</svg>';return `<div class="r39-legend">${series.map(s=>`<span><i class="r39-dot" style="background:${s.color}"></i>${e(s.name)}</span>`).join('')}</div><div class="r39-chart">${svg}</div><p class="r39-muted">Částky v Kč. Přesné hodnoty jsou v tabulkách níže.</p>`;
 }
 function header(){return `<div class="r39-head"><div><h2>Statistiky provozu</h2><span class="r39-muted">Administrátorský přehled · dokončené zakázky a potvrzené směny</span></div><div class="r39-tabs" role="tablist" aria-label="Přehled statistik">${can('finance.read')?`<button type="button" role="tab" data-r39-tab="earnings" aria-selected="${tab==='earnings'}">Výdělky firmy</button>`:''}${can('payroll.read')?`<button type="button" role="tab" data-r39-tab="employees" aria-selected="${tab==='employees'}">Zaměstnanci</button>`:''}</div></div><div class="r39-controls"><label>Měsíc<input type="month" data-r39-month value="${e(month)}" max="${today().slice(0,7)}"></label>${report?`<label>${tab==='earnings'?'Detail dne':'Zaměstnanec'}${tab==='earnings'?`<input type="date" data-r39-date value="${e(selectedDay)}" min="${e(report.month)}-01" max="${e(report.cutoff)}">`:`<select data-r39-employee><option value="all">Všichni zaměstnanci</option>${report.employees.map(w=>`<option value="${e(w.id)}" ${employee===w.id?'selected':''}>${e(w.name)}</option>`).join('')}</select>`}</label>`:''}<button type="button" class="btn secondary" data-r39-refresh>Obnovit data</button></div>`;}
 function notices(){const q=report.quality,items=[];if(q.unassignedOrders)items.push(`${q.unassignedOrders} dokončených zakázek (${cash(q.unassignedRevenue)}) nemá platné rozdělení do boxů. Jsou v celkových tržbách, nikoliv v tržbách jednotlivých boxů.`);if(q.unconfirmedDays)items.push(`${q.unconfirmedDays} dnů se zakázkami nemá potvrzenou odpracovanou směnu. Odměny za ně nejsou dopočítané.`);if(q.invalidDateOrders)items.push(`${q.invalidDateOrders} dokončených zakázek nemá čitelné datum a nejde je zařadit do měsíce.`);if(q.detailingWithoutReward)items.push('Detailing nemá nastavenou sazbu odměny; jeho tržby jsou zahrnuté, mzda se neodhaduje.');return items.length?`<div class="r39-notice">${items.map(e).join('<br>')}</div>`:'';}
 function earnings(){
  const r=report,day=r.daily.find(x=>x.date===selectedDay)?.current;
  let html=`<p class="r39-muted">${e(r.definitions.comparison)}<br>Porovnání: ${e(range(r.current))} proti ${e(range(r.previous))}.</p><div class="r39-grid">${card('Tržby vybraného měsíce',cash(r.current.revenue),delta(r.change)+' proti minulému měsíci')}${card('Celý předchozí měsíc',cash(r.previousFull.revenue),e(range(r.previousFull)))}</div>${notices()}${boxCards(r.current,'month')}`;
  html+=`<section class="r39-panel"><h3>Denní přehled · ${e(dateText(selectedDay))}</h3><div class="r39-grid">${card('Celkem za den',cash(day?.revenue),e(day?.orders||0)+' dokončených zakázek')}${card('Detailing / bez boxu',cash(stationValue(day,'DETAILING'))+' / '+cash(day?.unassignedRevenue),'Zahrnuto v denním celku')}</div>${boxCards(day,'day')}</section><div data-r40-box-detail>${boxHtml()}</div>`;
  html+=`<section class="r39-panel"><h3>Denní tržby vs. minulý měsíc</h3>${chart(r.daily.map(d=>String(d.day)),[{name:r.month,color:'#ff3157',values:r.daily.map(d=>d.current?.revenue??null)},{name:r.previousMonth,color:'#92929e',values:r.daily.map(d=>d.previous?.revenue??null),dashed:true}],'Denní tržby a porovnání s minulým měsícem')}</section>`;
  html+=`<section class="r39-panel"><h3>Měsíční tržby · posledních 12 měsíců</h3>${chart(r.monthly.map(m=>m.month.slice(5)+'.'+m.month.slice(2,4)),[{name:'Celkem',color:'#ff3157',values:r.monthly.map(m=>m.revenue)},{name:'Box 1',color:'#f1f1f5',values:r.monthly.map(m=>stationValue(m,'BOX1'))},{name:'Box 2',color:'#92929e',values:r.monthly.map(m=>stationValue(m,'BOX2')),dashed:true}],'Tržby za posledních dvanáct měsíců')}<p class="r39-muted">Aktuální měsíc obsahuje pouze období do ${e(dateText(r.today))}. Historické měsíce jsou celé.</p>${monthlyTable(r.monthly)}</section>`;
  html+=`<section class="r39-panel"><h3>Tržby po dnech · kliknutím vybereš detail</h3><div class="r39-table"><table><thead><tr><th>Datum</th><th>Celkem</th><th>Box 1</th><th>Box 2</th><th>Detailing</th><th>Bez boxu</th><th>Zakázky</th></tr></thead><tbody>${r.daily.filter(d=>d.current).map(d=>`<tr data-r39-day="${e(d.date)}" tabindex="0" aria-selected="${selectedDay===d.date}"><td>${e(dateText(d.date))}</td><td><b>${cash(d.current.revenue)}</b></td><td>${cash(stationValue(d.current,'BOX1'))}</td><td>${cash(stationValue(d.current,'BOX2'))}</td><td>${cash(stationValue(d.current,'DETAILING'))}</td><td>${cash(d.current.unassignedRevenue)}</td><td>${d.current.orders}</td></tr>`).join('')}</tbody></table></div></section>`;
  return html+`<p class="r39-muted">${e(r.definitions.revenue)}</p><details class="r39-panel"><summary>Další provozní statistiky · všechny zakázky</summary><p class="r39-muted">Původní souhrn včetně ostatních stavů; měsíční tržby dokončených zakázek jsou uvedeny výše.</p>${legacyHtml}</details>`;
 }
 function boxCards(value,period){return `<div class="p40-box-grid">${['BOX1','BOX2'].map(key=>`<button type="button" class="p40-box p40-${key.toLowerCase()}" data-r40-box="${key}" data-r40-period="${period}" aria-expanded="${boxChoice?.station===key&&boxChoice?.period===period}"><span>${e(station(key))} · ${period==='day'?'vybraný den':'měsíc'}</span><strong>${cash(stationValue(value,key))}</strong><small>Zobrazit auta, programy a částky <span aria-hidden="true">↗</span></small></button>`).join('')}</div>`;}
 function boxHtml(){if(!boxChoice)return '';const title=e(station(boxChoice.station))+' · '+e(boxChoice.from===boxChoice.to?dateText(boxChoice.from):dateText(boxChoice.from)+' – '+dateText(boxChoice.to));if(!boxDetail)return `<section class="r39-panel"><h3>${title}</h3><p role="status">Načítám rozpis boxu…</p></section>`;if(boxDetail.error)return `<section class="r39-panel"><h3>${title}</h3><p class="r39-notice">${e(boxDetail.error)}</p><button class="btn secondary" data-r40-retry>Zkusit znovu</button></section>`;const rows=boxDetail.orders.filter(o=>o.completed&&o.allocations.some(a=>a.station===boxChoice.station&&a.revenue!==0)),sum=rows.reduce((n,o)=>n+(o.allocations.find(a=>a.station===boxChoice.station)?.revenue||0),0);return `<section class="r39-panel p40-box-detail" tabindex="-1"><div class="r39-head"><div><h3>${title}</h3><span class="r39-muted">${rows.length} dokončených zakázek · ${cash(sum)}</span></div><button class="btn secondary small" data-r40-close>Zavřít rozpis</button></div><div class="r39-table"><table><thead><tr><th>Zakázka</th><th>Datum a čas</th><th>Vozidlo</th><th>Program</th><th>Částka pro box</th><th>Cena celé zakázky</th></tr></thead><tbody>${rows.map(o=>`<tr><td><button class="btn secondary small" data-r40-order="${e(o.id)}">${e(o.id)}</button></td><td>${e(dateText(o.date))} · ${e(perfectTimeText_(o.time))}</td><td>${e(o.vehicle||'—')}</td><td>${e(o.program||'—')}</td><td><b>${cash(o.allocations.find(a=>a.station===boxChoice.station)?.revenue)}</b>${o.shared?' · společně':''}</td><td>${cash(o.revenue)}</td></tr>`).join('')||'<tr><td colspan="6">V tomto výběru nejsou dokončené zakázky přiřazené tomuto boxu.</td></tr>'}</tbody></table></div><p class="r39-muted">U společné zakázky patří do součtu jen přidělená část ceny. Zakázky bez rozdělení jsou v přehledu „Bez boxu“.</p></section>`;}
 function loadBox(){if(!boxChoice||!admin())return;const seq=++boxRequest,choice={...boxChoice},token=sessionStorage.getItem('perfectAuthToken');boxDetail=null;draw();api('perfectBoxes49GetOverview',[{from:choice.from,to:choice.to}],data=>{if(seq!==boxRequest||sessionStorage.getItem('perfectAuthToken')!==token||state.page!=='stats')return;boxDetail=data;draw();document.querySelector('.p40-box-detail')?.focus({preventScroll:true});},err=>{if(seq===boxRequest&&sessionStorage.getItem('perfectAuthToken')===token){boxDetail={error:err.message};draw();}});}
 function bindBox(root){root.querySelectorAll('[data-r40-box]').forEach(b=>b.onclick=()=>{const period=b.dataset.r40Period;boxChoice={station:b.dataset.r40Box,period,from:period==='day'?selectedDay:report.current.from,to:period==='day'?selectedDay:report.cutoff};loadBox();});root.querySelector('[data-r40-retry]')?.addEventListener('click',loadBox);root.querySelector('[data-r40-close]')?.addEventListener('click',()=>{++boxRequest;boxChoice=null;boxDetail=null;draw();});root.querySelectorAll('[data-r40-order]').forEach(b=>b.onclick=()=>showOrderDetails(b.dataset.r40Order));}

 function closeDay(){++dayRequest;if(!dayOverlay)return;dayOverlay.remove();dayOverlay=null;const previous=dayLastFocus;dayLastFocus=null;if(previous?.isConnected)previous.focus({preventScroll:true});else document.querySelector('[data-r39-date]')?.focus({preventScroll:true});}
 function openDay(date){
  if(!admin()||state.page!=='stats'||!report?.daily.some(d=>d.date===date&&d.current))return;
  closeDay();selectedDay=date;++boxRequest;boxChoice=null;boxDetail=null;draw();dayLastFocus=document.activeElement;
  const overlay=document.createElement('div');overlay.id='perfectReportsDay42';overlay.className='overlay';overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="perfectReportsDay42Title"><div class="modal-head"><div class="r42-day-heading"><div class="eyebrow">ROZDĚLENÍ DENNÍCH TRŽEB</div><h2 id="perfectReportsDay42Title">${e(dateText(date))}</h2></div><button class="close" type="button" aria-label="Zavřít denní přehled" data-r42-day-close>×</button></div><div data-r42-day-body role="status" aria-live="polite"></div><div class="r42-day-footer"><button class="btn secondary" type="button" data-r42-day-close>Zavřít přehled</button></div></section>`;
  dayOverlay=overlay;document.body.append(overlay);overlay.querySelectorAll('[data-r42-day-close]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();closeDay();});overlay.onclick=ev=>{if(ev.target===overlay)closeDay();};overlay.onkeydown=ev=>{if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeDay();return;}if(ev.key!=='Tab')return;const controls=Array.from(overlay.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),[tabindex="0"]')),first=controls[0],last=controls.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}};
  overlay.querySelector('.close').focus({preventScroll:true});fetchDay();
  function fetchDay(){const seq=++dayRequest,token=sessionStorage.getItem('perfectAuthToken'),target=overlay.querySelector('[data-r42-day-body]');target.textContent='Načítám rozdělení zakázek do boxů…';const valid=()=>dayOverlay===overlay&&overlay.isConnected&&seq===dayRequest&&sessionStorage.getItem('perfectAuthToken')===token&&state.page==='stats'&&admin();
   api('perfectBoxes49GetOverview',[{from:date,to:date}],data=>{if(!valid())return;if(!data?.success||!Array.isArray(data.orders)||!Array.isArray(data.daily)){failure('Server nepotvrdil denní rozpis.');return;}const orders=data.orders.filter(o=>o.completed),allocation=(o,key)=>(o.allocations||[]).filter(a=>a.station===key).reduce((n,a)=>n+Number(a.revenue||0),0),total=orders.reduce((n,o)=>n+Number(o.revenue||0),0),parts=['BOX1','BOX2','DETAILING'].map(key=>({key,value:orders.reduce((n,o)=>n+allocation(o,key),0)})),unassigned=total-parts.reduce((n,p)=>n+p.value,0);target.removeAttribute('role');target.innerHTML=`<div class="r42-day-grid"><div class="r42-day-card"><span>Tržby celkem</span><strong>${cash(total)}</strong><small>${orders.length} dokončených zakázek</small></div>${parts.map(p=>{const shift=data.daily.find(d=>d.station===p.key&&d.date===date),worker=data.workers?.find(w=>w.id===shift?.userId);return `<div class="r42-day-card ${p.key.toLowerCase()}"><span>${e(station(p.key))}</span><strong>${cash(p.value)}</strong><small>${e(worker?.name||'Bez přiřazeného pracovníka')}</small><small>${shift?.pay?(shift.worked?'Potvrzená odměna ':'Dosavadní výdělek ')+cash(shift.pay.total):'Odměna nepotvrzená / bez sazby'}</small></div>`;}).join('')}<div class="r42-day-card"><span>Bez boxu</span><strong>${cash(unassigned)}</strong><small>Zakázky bez platného přiřazení</small></div></div><h3>Zakázky a přidělené částky</h3><div class="r42-day-table"><table><thead><tr><th>Zakázka / vůz</th><th>Čas</th><th>Program</th><th>Box 1</th><th>Box 2</th><th>Detailing</th><th>Bez boxu</th><th>Celá zakázka</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${e(o.id)}</b><br>${e(o.vehicle||'—')}${o.shared?'<br><small>Společně</small>':''}</td><td>${e(perfectTimeText_(o.time))}</td><td>${e(o.program||'—')}</td><td>${cash(allocation(o,'BOX1'))}</td><td>${cash(allocation(o,'BOX2'))}</td><td>${cash(allocation(o,'DETAILING'))}</td><td>${cash(Number(o.revenue||0)-['BOX1','BOX2','DETAILING'].reduce((n,key)=>n+allocation(o,key),0))}</td><td><b>${cash(o.revenue)}</b></td></tr>`).join('')||'<tr><td colspan="8">V tento den nejsou dokončené zakázky.</td></tr>'}</tbody></table></div><p class="r42-day-status">Společné zakázky jsou rozdělené podle uložených podílů. Do celkových tržeb se cena každé zakázky započítá jednou. Přehled zůstává otevřený až do zavření.</p><button class="btn secondary small" type="button" data-r42-day-refresh>Obnovit rozpis</button>`;target.querySelector('[data-r42-day-refresh]').onclick=fetchDay;
   },err=>{if(valid())failure(err?.message||String(err));});
   function failure(message){target.innerHTML=`<p class="r42-day-error" role="alert">${e(message)}</p><button class="btn secondary" type="button" data-r42-day-retry>Zkusit znovu</button>`;target.querySelector('[data-r42-day-retry]').onclick=fetchDay;}
  }
 }

 function monthlyTable(rows){return `<div class="r39-table"><table><thead><tr><th>Měsíc</th><th>Celkem</th><th>Box 1</th><th>Box 2</th><th>Detailing</th><th>Bez boxu</th><th>Zakázky</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${e(m.month)}${m.partial?' · průběžně':''}</td><td>${cash(m.revenue)}</td><td>${cash(stationValue(m,'BOX1'))}</td><td>${cash(stationValue(m,'BOX2'))}</td><td>${cash(stationValue(m,'DETAILING'))}</td><td>${cash(m.unassignedRevenue)}</td><td>${m.orders}</td></tr>`).join('')}</tbody></table></div>`;}
 function employees(){
  const r=report,rows=employee==='all'?r.employees:r.employees.filter(w=>w.id===employee),sum=(key)=>rows.reduce((n,w)=>n+w.current[key],0),max=Math.max(1,...r.employees.map(w=>w.current.amount));
  let html=`<p class="r39-muted">Odměny: ${e(range(r.current))}. Výdělek potvrzené směny: 1 400 Kč + 25 % z přiřazeného součtu nad 6 000 Kč + bonus za víkend. Porovnání se stejnou částí minulého měsíce: ${e(range(r.previous))}.</p><div class="r39-grid">${card(employee==='all'?'Odměny všech zaměstnanců':'Odměna zaměstnance',cash(sum('amount')),'Vypočteno pouze z potvrzených směn')}${card('Základní odměny',cash(sum('base')))}${card('Výkonové bonusy',cash(sum('performanceBonus')))}${card('Bonusy za víkend',cash(sum('weekendBonus')))}${card('Potvrzené směny',e(sum('confirmedShifts')))}${card('Celý předchozí měsíc',cash(rows.reduce((n,w)=>n+w.previousFull.amount,0)),e(range(r.previousFull)))}</div>${notices()}`;
  if(!sum('confirmedShifts'))html+='<div class="r39-notice">V tomto výběru nejsou evidované potvrzené odpracované směny s vypočtenou odměnou. Nula neznamená, že zaměstnanec nepracoval.</div>';
  html+=`<section class="r39-panel"><h3>Zaměstnanci · odměny za vybrané období</h3><div class="r39-ranking">${r.employees.map(w=>`<div class="r39-rank-line"><span>${e(w.name)}</span><div class="r39-track"><div class="r39-fill" style="width:${Math.max(0,w.current.amount/max*100)}%"></div></div><b>${cash(w.current.amount)}</b></div>`).join('')||'<p>Nejsou evidovaní zaměstnanci.</p>'}</div></section>`;
  html+=`<section class="r39-panel"><h3>Vývoj odměn · ${employee==='all'?'všichni zaměstnanci':e(rows[0]?.name||'zaměstnanec')}</h3>${chart(r.monthly.map(m=>m.month.slice(5)+'.'+m.month.slice(2,4)),[{name:'Vypočtené odměny',color:'#ff3157',values:r.monthly.map((m,i)=>rows.reduce((n,w)=>n+w.months[i].amount,0))}],'Měsíční vývoj odměn zaměstnanců')}<div class="r39-table"><table><thead><tr><th>Měsíc</th><th>Odměny</th><th>Potvrzené směny</th></tr></thead><tbody>${r.monthly.map((m,i)=>`<tr><td>${e(m.month)}${m.partial?' · průběžně':''}</td><td>${cash(rows.reduce((n,w)=>n+w.months[i].amount,0))}</td><td>${rows.reduce((n,w)=>n+w.months[i].confirmedShifts,0)}</td></tr>`).join('')}</tbody></table></div></section>`;
  html+=`<section class="r39-panel"><h3>Všichni zaměstnanci · kliknutím otevřeš rozpis</h3><div class="r39-table"><table><thead><tr><th>Zaměstnanec</th><th>Směny</th><th>Odměna</th><th>Minulé srovnatelné období</th><th>Změna</th><th>Dny bez potvrzení</th></tr></thead><tbody>${r.employees.map(w=>`<tr data-r39-person="${e(w.id)}" tabindex="0" aria-selected="${employee===w.id}"><td><b>${e(w.name)}</b><br><span class="r39-muted">@${e(w.username||'historický účet')}${w.active?'':' · neaktivní'}</span></td><td>${w.current.confirmedShifts}</td><td>${cash(w.current.amount)}</td><td>${cash(w.previous.amount)}</td><td>${delta(w.change)}</td><td>${w.current.unconfirmedDays}</td></tr>`).join('')}</tbody></table></div></section>`;
  if(employee!=='all')html+=`<section class="r39-panel"><h3>Denní rozpis · ${e(rows[0]?.name)}</h3><div class="r39-table"><table><thead><tr><th>Datum</th><th>Stanoviště</th>${can('finance.read')?'<th>Samostatně</th><th>Společně</th><th>Tržba celkem</th>':''}<th>Základ</th><th>25 % nad limit</th><th>Bonus za víkend</th><th>Odměna</th><th>Stav směny</th></tr></thead><tbody>${(rows[0]?.days||[]).map(d=>`<tr><td>${e(dateText(d.date))}</td><td>${e(station(d.station))}</td>${can('finance.read')?`<td>${cash(d.soloRevenue)}</td><td>${cash(d.sharedRevenue)}</td><td><b>${cash(d.stationRevenue)}</b></td>`:''}<td>${d.pay?cash(d.pay.base):'—'}</td><td>${d.pay?cash(d.pay.performanceBonus):'—'}</td><td>${d.pay?cash(d.pay.weekendBonus):'—'}</td><td>${d.confirmed?cash(d.reward):'—'}</td><td>${d.station==='DETAILING'?'Bez sazby odměny':d.confirmed?'Odpracováno a potvrzeno':'Nepotvrzeno'}</td></tr>`).join('')||'<tr><td colspan="10">Žádné přiřazené směny v tomto období.</td></tr>'}</tbody></table></div></section>`;
  return html+`<p class="r39-muted">${e(r.definitions.reward)}</p>`;
 }
 function bind(){const root=document.getElementById(rootId);if(!root)return;bindBox(root);root.querySelectorAll('[data-r39-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.r39Tab;draw();});root.querySelector('[data-r39-month]').onchange=event=>{closeDay();month=event.target.value;report=null;selectedDay='';load();};root.querySelector('[data-r39-refresh]').onclick=()=>load();const date=root.querySelector('[data-r39-date]');if(date)date.onchange=ev=>{if(report.daily.some(d=>d.date===ev.target.value&&d.current)){openDay(ev.target.value);}};const person=root.querySelector('[data-r39-employee]');if(person)person.onchange=ev=>{employee=ev.target.value;draw();};root.querySelectorAll('[data-r39-day]').forEach(row=>{const choose=()=>openDay(row.dataset.r39Day);row.onclick=ev=>{ev.stopPropagation();choose();};row.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose();}};});root.querySelectorAll('[data-r39-person]').forEach(row=>{const choose=()=>{employee=row.dataset.r39Person;draw();};row.onclick=choose;row.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose();}};});}
 function draw(){if(state.page!=='stats'||!admin())return;if(tab==='earnings'&&!can('finance.read'))tab='employees';if(tab==='employees'&&!can('payroll.read'))tab='earnings';app.innerHTML=`<div id="${rootId}">${header()}<div data-r39-body>${report?(tab==='employees'?employees():earnings()):'<div class="r39-empty" role="status">Načítám statistiky…</div>'}</div></div>`;bind();}
 function load(){if(!admin()||state.page!=='stats')return;++boxRequest;boxChoice=null;boxDetail=null;const sequence=++requestId,token=sessionStorage.getItem('perfectAuthToken'),requested=month;draw();const root=document.getElementById(rootId);root.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);root.querySelector('[data-r39-body]').innerHTML='<div class="r39-empty" role="status">Načítám tržby a potvrzené směny…</div>';api('perfectReports39Get',[{month:requested}],data=>{if(sequence!==requestId||sessionStorage.getItem('perfectAuthToken')!==token||state.page!=='stats')return;if(!data||data.release!=='PERFECT-REPORTS-39'){failed('Server neposlal přehled V39. Zkontroluj soubor 39_STATISTIKY_TRZBY_ZAMESTNANCI a nové nasazení.');return;}report=data;month=data.month;if(!can('finance.read'))tab='employees';else if(!can('payroll.read'))tab='earnings';if(!data.daily.some(d=>d.date===selectedDay&&d.current))selectedDay=data.cutoff;if(employee!=='all'&&!data.employees.some(w=>w.id===employee))employee='all';draw();},err=>{if(sequence===requestId&&sessionStorage.getItem('perfectAuthToken')===token&&state.page==='stats')failed(err.message);});}
 function failed(message){draw();const root=document.getElementById(rootId);if(root)root.querySelector('[data-r39-body]').innerHTML=`<div class="r39-notice" role="alert">Statistiky se nepodařilo načíst: ${e(message)}</div>`;}
 const originalStats=renderStats;
 renderStats=function(){if(!admin()){app.innerHTML='<section class="section"><h3>Statistiky tržeb</h3><p>Tento přehled není pro tvůj účet dostupný. Vlastní výkon a odměny najdeš v profilu.</p></section>';return;}if(document.getElementById(rootId))return;if(!legacyHtml){originalStats();legacyHtml=app.innerHTML;}month=month||today().slice(0,7);if(report)draw();else load();};
 const originalLogin=showLogin;
 showLogin=function(){closeDay();requestId++;++boxRequest;boxChoice=null;boxDetail=null;report=null;legacyHtml='';month='';selectedDay='';employee='all';tab='earnings';document.getElementById(rootId)?.remove();return originalLogin.apply(this,arguments);};
 const dayObserver=new MutationObserver(()=>{if(dayOverlay&&(state.page!=='stats'||!admin()||!sessionStorage.getItem('perfectAuthToken')))closeDay();});dayObserver.observe(app,{childList:true});
 window.PerfectReports39={refresh:load,openFinance:()=>{if(!can('finance.read'))return;tab='earnings';window.perfectGo('stats');if(report)draw();document.getElementById('pageTitle').textContent='Finanční přehledy';}};
})();
