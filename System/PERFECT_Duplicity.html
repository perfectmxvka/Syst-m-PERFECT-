<script>
(()=>{if(!document.getElementById('perfect-duplicates56-css')){const style=document.createElement('style');style.id='perfect-duplicates56-css';style.textContent="\n#perfectDuplicates38 .d56-pair-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n#perfectDuplicates38 .d56-order{min-width:0;margin:0;position:relative;overflow-wrap:anywhere}\n#perfectDuplicates38 .d56-order.is-selected{border-color:#f05267;background:#351a22;box-shadow:inset 0 0 0 1px #f05267}\n#perfectDuplicates38 .d56-select{display:flex;align-items:center;gap:9px;cursor:pointer;margin-bottom:14px;font-size:12px;color:#e8c3cb;min-height:40px}\n#perfectDuplicates38 .d56-select input{position:static;display:block;width:22px;height:22px;min-height:22px;margin:0;accent-color:#ec344e}\n#perfectDuplicates38 .d56-selection-footer{position:sticky;bottom:0;z-index:2;background:#17191df7;border:1px solid #55505b;border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}\n#perfectDuplicates38 .d56-car{display:flex;align-items:center;gap:9px;margin:10px 0}#perfectDuplicates38 .d56-car img{width:35px;height:35px;object-fit:contain}\n@media(max-width:600px){#perfectDuplicates38 .d56-pair-grid{gap:7px}#perfectDuplicates38 .d56-order{padding:10px!important;font-size:11px}#perfectDuplicates38 .d56-order h3{font-size:13px}#perfectDuplicates38 .d56-select{font-size:10px;align-items:flex-start}#perfectDuplicates38 .d56-selection-footer .btn{width:100%}}\n";document.head.append(style);}})();

/* V56 — označení jednotlivých objednávek, jeden společný výběr napříč dvojicemi a stránkami. */
const PerfectDuplicates38=(()=>{
 let result=null,pending=false,overlay=null,offset=0,seen=new Set(),busy=false,generation=0;
 const selected=new Map();
 const call=(name,args=[])=>new Promise((ok,fail)=>api(name,args,ok,fail));
 const admin=()=>window.PerfectAccess40?.can('duplicates.manage');
 const errorText=e=>String(e?.message||e||'Operace se nezdařila.');
 function banner(){let el=document.getElementById('perfectDuplicatesBanner38');if(!el){el=document.createElement('div');el.id='perfectDuplicatesBanner38';el.className='notice';el.style.marginBottom='14px';app.before(el);}return el;}
 function card(o,pairIndex){const id=String(o.ORDER_ID);return `<section class="section d56-order ${selected.has(id)?'is-selected':''}" data-d56-card="${esc(id)}">${admin()?`<label class="d56-select"><input type="checkbox" data-d56-select="${esc(id)}" data-d56-pair="${pairIndex}" ${selected.has(id)?'checked':''} ${busy?'disabled':''}><span>Označit k odstranění</span></label>`:''}<h3>${esc(id)}</h3><p><b>${esc(o.JMENO_PRIJMENI||'—')}</b><br>${esc(dateText(o.DATUM_OBJEDNANI))} · ${esc(perfectTimeText_(o.CAS_PRIJEZDU))}<br>${esc(o.TELEFON||'—')}<br>${esc(o.EMAIL||'—')}</p><div class="d56-car">${typeof vehicleLogoMarkup==='function'?vehicleLogoMarkup(o.VOZIDLO):''}<b>${esc(o.VOZIDLO||'—')}</b></div><p>${esc(o.SPZ||'SPZ neuvedena')}<br>${esc(o.MYCI_PROGRAM||'—')} · ${money(o.CENA_CELKEM)}<br>${esc(o.STAV_OBJEDNAVKY||'—')}</p><p style="white-space:pre-wrap">${esc(o.POZNAMKY||'')}</p></section>`;}
 function syncSelection(){if(!overlay)return;overlay.querySelectorAll('[data-d56-select]').forEach(input=>{input.checked=selected.has(input.dataset.d56Select);input.closest('[data-d56-card]').classList.toggle('is-selected',input.checked);input.disabled=busy;});const label=overlay.querySelector('[data-d56-count]');if(label)label.textContent='Označeno objednávek: '+selected.size;const remove=overlay.querySelector('[data-d56-remove]');if(remove){remove.disabled=busy||pending||!selected.size;remove.textContent=busy?'Odstraňuji…':'Odstranit označené duplikace ('+selected.size+')';}const clear=overlay.querySelector('[data-d56-clear]');if(clear)clear.disabled=busy||!selected.size;}
 function render(){
  if(!overlay||!result)return;const {pairs,total}=result;
  overlay.querySelector('[data-d38-body]').innerHTML=`<p>Prověřeno ${result.scannedOrders} uložených zakázek. Podezřelých dvojic: <b>${total}</b>.</p><p class="muted">Zaškrtni objednávky, které chceš odstranit. Stejná objednávka zobrazená ve více dvojicích se počítá jednou. Odstraní se všechny označené kusy, i když označíš obě objednávky ve dvojici. Před odstraněním se uloží archivní kopie.</p>${!admin()?'<p class="notice">K odstranění duplicit potřebuješ oprávnění pro jejich správu.</p>':''}${pairs.map((p,i)=>`<article class="section"><h3>${esc(p.reason)}</h3><div class="d56-pair-grid">${p.orders.map(o=>card(o,i)).join('')}</div>${admin()?`<div class="form-actions"><button class="btn secondary" data-d38-both="${i}" ${busy?'disabled':''}>Ponechat obě — nejsou duplicitní</button></div>`:''}</article>`).join('')||'<p>Žádné nevyřešené podezřelé dvojice.</p>'}<div class="form-actions"><button class="btn secondary" data-d38-prev ${busy||offset===0?'disabled':''}>Předchozí</button><span>${total?offset+1:0}–${Math.min(offset+pairs.length,total)} z ${total}</span><button class="btn secondary" data-d38-next ${busy||offset+pairs.length>=total?'disabled':''}>Další</button></div>${admin()?'<footer class="d56-selection-footer"><strong data-d56-count></strong><button class="btn secondary" type="button" data-d56-clear>Zrušit výběr</button><button class="btn" type="button" data-d56-remove></button></footer>':''}`;
  overlay.querySelector('[data-d38-prev]').onclick=()=>{if(busy)return;offset=Math.max(0,offset-20);check(false);};overlay.querySelector('[data-d38-next]').onclick=()=>{if(busy)return;offset+=20;check(false);};
  overlay.querySelectorAll('[data-d38-both]').forEach(button=>button.onclick=()=>keepBoth(result.pairs[Number(button.dataset.d38Both)]));
  overlay.querySelectorAll('[data-d56-select]').forEach(input=>input.onchange=()=>{if(busy)return;const id=input.dataset.d56Select,pair=result.pairs[Number(input.dataset.d56Pair)];if(input.checked)selected.set(id,{id,pair:{ids:pair.orders.map(o=>String(o.ORDER_ID)),key:pair.key,version:pair.version}});else selected.delete(id);syncSelection();});
  overlay.querySelector('[data-d56-clear]')?.addEventListener('click',()=>{if(!busy){selected.clear();syncSelection();}});overlay.querySelector('[data-d56-remove]')?.addEventListener('click',removeSelected);syncSelection();
 }
 function message(text){if(overlay)overlay.querySelector('[data-d38-error]').textContent=text;}
 function setBusy(value){busy=value;if(overlay)overlay.querySelectorAll('button,input').forEach(el=>el.disabled=value);if(!value)render();else syncSelection();}
 async function keepBoth(pair){if(busy||pending||!admin())return;const gen=generation;setBusy(true);message('Ukládám rozhodnutí…');try{await call('perfectDuplicates38Resolve',[{ids:pair.orders.map(o=>o.ORDER_ID),key:pair.key,version:pair.version,action:'KEEP_BOTH'}]);if(gen!==generation)return;pair.orders.forEach(o=>selected.delete(String(o.ORDER_ID)));seen.add(pair.key+pair.version);offset=0;await check(false);message('Obě objednávky ponechány.');}catch(e){if(gen===generation)message(errorText(e));}finally{if(gen===generation)setBusy(false);}}
 async function removeSelected(){
  if(busy||pending||!admin()||!selected.size)return;const gen=generation,items=[...selected.values()];setBusy(true);message('Archivuji a odstraňuji '+items.length+' označených objednávek…');
  try{
   const response=await call('perfectDuplicates56RemoveSelected',[{items}]);if(gen!==generation)return;
   if(!response||!Array.isArray(response.removedIds)||!Array.isArray(response.failed))throw Error('Server nepotvrdil výsledek odstranění. Obnov přehled.');
   response.removedIds.forEach(id=>selected.delete(String(id)));offset=0;
   if(response.removedIds.length){try{await loadAll();}catch(e){PerfectFeedback36.show(false,'Objednávky odstraněny, ale přehled se nepodařilo obnovit: '+errorText(e));}}
   await check(false);if(gen!==generation)return;
   const failures=response.failed.map(f=>f.id+': '+f.message).join(' · '),warnings=(response.warnings||[]).join(' · ');
   message('Odstraněno objednávek: '+response.removedIds.length+'.'+(failures?' Neodstraněné: '+failures:'')+(warnings?' '+warnings:''));
  }catch(e){if(gen===generation){message(errorText(e));PerfectFeedback36.show(false,errorText(e));}}
  finally{if(gen===generation)setBusy(false);}
 }
 function open(){if(overlay){render();return;}overlay=document.createElement('div');overlay.className='overlay';overlay.id='perfectDuplicates38';overlay.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-label="Možné duplicitní rezervace" style="width:min(1100px,100%)"><div class="modal-head"><div><div class="eyebrow">KONTROLA VČETNĚ HISTORIE</div><h2>Možné duplicitní rezervace</h2></div><button class="close" type="button" aria-label="Zavřít">×</button></div><p data-d38-error class="message" role="status"></p><button class="btn secondary" data-d38-refresh>Obnovit kontrolu</button><div data-d38-body>Načítám…</div></section>';overlay.querySelector('.close').onclick=()=>{if(busy)return;result?.pairs.forEach(p=>seen.add(p.key+p.version));overlay.remove();overlay=null;};overlay.querySelector('[data-d38-refresh]').onclick=()=>{if(!busy)check(false);};document.body.append(overlay);render();}
 async function check(prompt=true){
  if(pending||!perfectAuthUser||!sessionStorage.getItem('perfectAuthToken'))return;pending=true;syncSelection();const gen=generation;
  try{const next=await call('perfectDuplicates38List',[{offset,limit:20}]);if(gen!==generation||!perfectAuthUser)return;result=next;if(offset>=next.total&&offset>0){offset=0;pending=false;return check(false);}const el=banner();el.hidden=!next.total;el.replaceChildren();if(next.total){const button=document.createElement('button');button.type='button';button.className='btn secondary small';button.textContent='Možné duplicity: '+next.total+' — porovnat včetně historie';button.onclick=()=>{offset=0;open();check(false);};el.append(button);}render();if(prompt&&next.pairs.some(p=>!seen.has(p.key+p.version))&&!overlay&&!document.querySelector('.overlay'))open();}
  catch(e){if(gen!==generation)return;if(overlay)message('Kontrola se nezdařila: '+errorText(e));const el=banner();el.hidden=false;el.textContent='Kontrola duplicit není dostupná: '+errorText(e);}
  finally{if(gen===generation){pending=false;syncSelection();}}
 }
 function reset(){generation++;pending=false;busy=false;seen.clear();selected.clear();result=null;offset=0;overlay?.remove();overlay=null;document.getElementById('perfectDuplicatesBanner38')?.remove();}
 window.perfectDuplicatesOpen38=()=>{open();check(false);};setInterval(()=>{if(!document.hidden&&!busy)check(true);},60000);return {check,reset};
})();
</script>
