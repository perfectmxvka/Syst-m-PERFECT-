#authGate:before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.46);backdrop-filter:blur(1px)}
.auth-card{position:relative;width:min(440px,100%);padding:30px;border:1px solid rgba(255,255,255,.22);border-radius:18px;background:rgba(10,11,13,.91);box-shadow:0 25px 80px #000b;backdrop-filter:blur(16px)}
.auth-brand{color:#fff;text-align:center;font-size:12px;letter-spacing:4px;font-weight:800;margin-bottom:8px}
.auth-card h2{text-align:center;margin:0 0 8px;font-size:27px}.auth-card .muted{text-align:center;margin-bottom:22px}
.auth-card label{display:block;margin:14px 0 6px;color:#d6d7db;font-size:12px;font-weight:bold}
.auth-card input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid #45464b;background:#17181c;color:#fff;outline:none}
.auth-card input:focus{border-color:#ed1027;box-shadow:0 0 0 3px #ed102722}
.auth-card button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:9px;background:#bd1026;color:white;font-weight:800}
.auth-error{color:#ff9ca7;min-height:20px;margin-top:12px;font-size:12px;text-align:center}
.auth-small{font-size:11px;text-align:center;color:#a7a7ad;margin-top:17px}

/* PERFECT U06 — značky vozidel */
.vehicle-brand-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.vehicle-brand-logo{width:34px;height:30px;object-fit:contain;flex:0 0 34px;padding:3px;background:#fff;border:1px solid #343842;border-radius:7px}
.vehicle-logo-fallback{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;flex:0 0 34px;border:1px solid #343842;border-radius:7px;background:#17191e;font-size:17px}
.vehicle-brand-name{display:block;line-height:1.35}
@media(max-width:560px){.vehicle-brand-cell{min-width:150px;gap:7px}.vehicle-brand-logo,.vehicle-logo-fallback{width:29px;height:27px;flex-basis:29px}}

.order-id{font-weight:800;white-space:nowrap}.order-id-offline{color:#f59e0b}.order-id-online{color:#38bdf8}.order-id-other{color:inherit}
.spinner{display:inline-block;width:17px;height:17px;margin-right:9px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-3px;animation:perfectSpin .8s linear infinite}
@keyframes perfectSpin{to{transform:rotate(360deg)}}
button:disabled{cursor:wait;opacity:.7}.form-grid input[readonly]{color:var(--muted)}
@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-right-color:currentColor}}

 body{overflow-x:hidden}

 body.perfect-mobile-nav-open .mobile-menu-backdrop{opacity:1;visibility:visible;pointer-events:auto}

 .layout>main .top-actions .btn{min-height:45px;flex:1;white-space:normal}
 .layout>main .connection-chip{max-width:52%;min-width:0}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .columns,.stat-grid{grid-template-columns:1fr!important}
 .card,.section{padding:14px}

 table{width:max-content;min-width:100%}
 th,td{padding:10px 12px;white-space:nowrap}
 .toolbar{display:flex;gap:8px;flex-wrap:wrap}
 .toolbar .search{flex:1 1 100%;min-width:0}
 .toolbar button{min-height:42px}
 .overlay{padding:0!important;align-items:flex-end!important;overscroll-behavior:contain}
 .overlay>.modal,.overlay .modal{width:100%!important;max-width:100%!important;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 10px)!important;border-radius:18px 18px 0 0!important;overflow:auto;padding:19px 15px calc(22px + env(safe-area-inset-bottom,0px))!important;-webkit-overflow-scrolling:touch}
 .modal-head{position:relative;gap:12px}
 .close{min-width:44px!important;min-height:44px!important}

 .form-grid .full{grid-column:1/-1!important}
 input,textarea,select,.field{font-size:16px!important;min-height:44px;max-width:100%}
 input[type=checkbox],input[type=radio]{min-height:initial;min-width:19px;min-height:19px}

async function compress(file,slot){if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type||'')&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name||''))throw Error('Vyber fotografii JPG, PNG, WebP nebo HEIC.');if(file.size>12*1024*1024)throw Error('Maximum je 12 MB.');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('Obrázek nelze načíst.'));img.src=url});const max=slot==='profile'?600:1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let out=c.toDataURL('image/jpeg',.82);if(out.length>1600000)out=c.toDataURL('image/jpeg',.65);if(out.length>2000000)throw Error('Fotografie je po zmenšení stále příliš velká.');return out}finally{URL.revokeObjectURL(url)}}
function photoMarkup(kind,id,slot,label){return `<div class="pd-photo" data-kind="${esc(kind)}" data-id="${esc(id)}" data-slot="${esc(slot)}"><div class="pd-photo-image">${avatar(imageFor(kind,id,slot))}</div>${window.PerfectCustomerAwards51?.photo(kind,id,slot)||''}<label class="btn secondary pd-photo-upload" data-upload>${esc(label)}<input type="file" accept="image/*" aria-label="${esc(label)}"></label><div class="message" role="status"></div></div>`}
function bindPhotos(dialog){dialog.el.querySelectorAll('.pd-photo').forEach(box=>{const {kind,id,slot}=box.dataset,button=q('[data-upload]',box),input=q('input',box),msg=q('.message',box);q('.pd-photo-image',box).onclick=()=>{const src=imageFor(kind,id,slot);if(!src)return;const m=modal('Fotografie',`<img src="${esc(src)}" alt="Fotografie vozidla nebo zákazníka" style="width:100%;max-height:75vh;object-fit:contain">`);m.el.classList.add('pd-lightbox')};input.onchange=async()=>{const file=input.files[0];if(!file)return;input.disabled=true;button.classList.add('pd-upload-busy');dialog.busy(true);msg.textContent='Zpracovávám fotografii…';try{if(typeof adapter.savePhoto!=='function')throw Error('Ukládání fotografií ještě není připojené k backendu.');const encoded=await compress(file,slot);msg.textContent='Ukládám fotografii…';const result=await adapter.savePhoto({kind,id,slot,dataUrl:encoded});if(result?.success!==true)throw Error(result?.message||'Server nepotvrdil uložení fotografie.');cache.set(kind+':'+id+':'+slot,safeImage(result.dataUrl)||encoded);photoVersions.set(kind+':'+id+':'+slot,(photoVersions.get(kind+':'+id+':'+slot)||0)+1);q('.pd-photo-image',box).innerHTML=avatar(imageFor(kind,id,slot));msg.textContent='Fotografie uložena.';adapter.onPhotoSaved?.({kind,id,slot});}catch(e){msg.textContent=e.message}finally{input.disabled=false;button.classList.remove('pd-upload-busy');dialog.busy(false);input.value=''}}})}
async function loadPhotos(kind,id,root){if(typeof adapter.loadPhotos!=='function')return;try{const versions=new Map(photoVersions);const result=await adapter.loadPhotos({kind,id});if(!result||result.success!==true)throw Error(result?.message||'Fotografie se nepodařilo načíst.');Object.entries(result.photos||{}).forEach(([slot,url])=>{if(safeImage(url)&&(versions.get(kind+':'+id+':'+slot)||0)===(photoVersions.get(kind+':'+id+':'+slot)||0))cache.set(kind+':'+id+':'+slot,url)});if(root?.isConnected)root.querySelectorAll('.pd-photo').forEach(b=>q('.pd-photo-image',b).innerHTML=avatar(imageFor(kind,id,b.dataset.slot)))}catch(e){if(root?.isConnected){const m=root.querySelector('.message');if(m)m.textContent='Načtení fotografií: '+e.message}}}

function editMarkup(kind,record){
 const customer=kind==='customer';
 const fields=customer?[
  ['JMENO_PRIJMENI','Jméno a příjmení','text',record.JMENO_PRIJMENI||''],
  ['EMAIL','E-mail','email',record.EMAIL||''],
  ['TELEFON','Telefonní číslo','tel',String(record.TELEFON||'').includes('#ERROR')?'':record.TELEFON||'']
 ]:[['VOZIDLO','Značka a model vozidla','text',record.VOZIDLO||'']];
 return `<section class="section pd-v10-edit"><div class="pd-v10-edit-head"><h3>Upravit ${customer?'údaje zákazníka':'údaje vozidla'}</h3><button class="btn secondary small" type="button" data-v10-toggle>✎ Upravit údaje</button></div><form data-v10-form hidden>${fields.map(([key,label,type,value])=>`<label class="pd-v10-field"><span>${esc(label)}</span><input class="field" name="${key}" type="${type}" value="${esc(value)}" ${key==='JMENO_PRIJMENI'||key==='VOZIDLO'?'required':''} maxlength="${key==='EMAIL'?180:120}"></label>`).join('')}<p class="muted" style="font-size:12px">ID a propojení se zakázkami zůstávají zachována. SPZ je uložena u zakázek, ne v kartě vozidla.</p><div class="pd-v10-actions"><button class="btn" type="submit" data-v10-save>Uložit změny</button><button class="btn secondary" type="button" data-v10-cancel>Zrušit</button></div><div class="message" data-v10-message role="status"></div></form></section>`;
}
function bindEdit(dialog,kind,id,record){
 const container=dialog.el.querySelector('.pd-modal');
 container.insertAdjacentHTML('beforeend',editMarkup(kind,record));
 const section=container.querySelector('.pd-v10-edit');
 if(!section)throw new Error('V11: formulář úprav se nepodařilo vložit.');
 const form=section.querySelector('[data-v10-form]');
 const toggle=section.querySelector('[data-v10-toggle]');
 const message=section.querySelector('[data-v10-message]');
 toggle.onclick=()=>{form.hidden=!form.hidden;toggle.setAttribute('aria-expanded',String(!form.hidden));if(!form.hidden)form.querySelector('input')?.focus()};
 section.querySelector('[data-v10-cancel]').onclick=()=>{form.reset();form.hidden=true;message.textContent=''};
 form.onsubmit=async e=>{
  e.preventDefault();
  if(typeof adapter.saveRecord!=='function'){message.textContent='Chybí funkce úpravy v backendu.';return}
  const payload=Object.fromEntries(new FormData(form).entries());
  const btn=form.querySelector('[data-v10-save]');btn.disabled=true;dialog.busy(true);message.textContent='Ukládám změny…';
  try{
   const result=await adapter.saveRecord({kind,id,data:payload});
   if(!result?.success)throw Error(result?.message||'Server nepotvrdil uložení.');
   const updated=result.record||{};
   Object.assign(record,updated);
   adapter.onRecordSaved?.({kind,id,record});
   message.textContent='Změny byly uloženy. Při dalším otevření karty uvidíš nové údaje.';
   form.hidden=true;
   const heading=container.querySelector('.pd-profile h2');
   if(heading)heading.textContent=kind==='customer'?record.JMENO_PRIJMENI:record.VOZIDLO;
   if(kind==='customer'){
     const info=container.querySelector('.pd-profile p');
     if(info)info.textContent=(record.TELEFON||'Telefon neuveden')+' · '+(record.EMAIL||'E-mail neuveden');
   }
  }catch(err){message.textContent='Chyba: '+(err?.message||err)}
  finally{btn.disabled=false;dialog.busy(false)}
 };
}
