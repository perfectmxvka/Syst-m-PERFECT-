<script>
/* Uvnitř hlavní aplikace: UI respektuje stejný seznam oprávnění jako server. */
(()=>{
 const can=cap=>Array.isArray(cap)?cap.some(can):!!perfectAuthUser&&(perfectAuthUser.superAdmin40===true||(perfectAuthUser.capabilities40||[]).includes(cap));
 const superAdmin=()=>perfectAuthUser?.superAdmin40===true;
 const call=(name,args=[])=>new Promise((ok,fail)=>api(name,args,ok,fail));
 window.PerfectAccess40={can,superAdmin};
 perfectWriteCalls36.add('perfectSecurity40Save');perfectWriteCalls36.add('perfectSecurity43CreateOwner');
 const pageCaps={orders:'orders.read',calendar:'orders.read',detailing:'orders.read',customers:'customers.read',vehicles:'vehicles.read',payments:'finance.read',stats:['finance.read','payroll.read'],services:'services.read',vouchers:'vouchers.read'};
 let settingsTab='access',settingsGeneration=0,auditOffset=0;
 function applyAccess(){
  const hide=(selector,cap)=>document.querySelectorAll(selector).forEach(b=>{const h=!can(cap);if(b.hidden!==h)b.hidden=h;});
  hide('#perfectBoxesNav36','finance.read');hide('#perfUserNew,[data-p40-accounts]','users.manage');hide('#perfCheckFake,.admin-archive-order','orders.archive');hide('.edit-order','orders.edit');hide('[onclick*="perfectServiceNew"],[onclick*="perfectServiceEdit"]','services.edit');hide('.pv9-revenue','finance.read');
  const order=document.querySelector('#orderForm');if(order&&!can('prices.edit')){order.querySelectorAll('[name="CENA_PROGRAMU"],[name="CENA_CELKEM"],[data-addon-input31]').forEach(el=>{if(!el.readOnly)el.readOnly=true;});const priceAuto=order.querySelector('#priceAuto31');if(priceAuto&&!priceAuto.hidden)priceAuto.hidden=true;if(order.dataset.editing43==='true')order.querySelectorAll('[name="PROGRAM_ID"],[name="MYCI_PROGRAM"],[name="ADDON_ID"],[name="ZNECISTENI_20"]').forEach(el=>{if(!el.disabled)el.disabled=true;});}
  const boxes=document.querySelector('#perfectBoxes25');if(boxes){boxes.querySelectorAll('[data-box-shift],[data-box-save],[data-box-select],[data-box-edit-shared]').forEach(el=>{const h=!can('shifts.manage');if(el.hidden!==h)el.hidden=h;});}

  document.querySelectorAll('[data-page]').forEach(b=>{const cap=pageCaps[b.dataset.page];if(cap&&b.hidden===can(cap))b.hidden=!can(cap);});
  document.querySelectorAll('[data-permission40]').forEach(b=>{const hide=!can(b.dataset.permission40);if(b.hidden!==hide)b.hidden=hide;});
  document.querySelectorAll('[data-pv6-go]').forEach(b=>{const cap=pageCaps[b.dataset.pv6Go];if(cap&&b.hidden===can(cap))b.hidden=!can(cap);});
  const newOrder=document.getElementById('newOrder');if(newOrder&&newOrder.hidden===can('orders.create'))newOrder.hidden=!can('orders.create');
 }
 const originalRender=render;
 render=function(){applyAccess();const cap=pageCaps[state.page];if(cap&&!can(cap)){app.innerHTML='<section class="section"><h3>Tento přehled není dostupný</h3><p class="muted">Přístup k této části není pro tvůj účet povolený.</p><button class="btn secondary" onclick="window.perfectGo(\'dashboard\')">Zpět na hlavní panel</button></section>';return;}originalRender.apply(this,arguments);applyAccess();};
 const originalNew=window.perfectNewOrder;
 window.perfectNewOrder=function(){if(!can('orders.create')){PerfectFeedback36.show(false,'Vytváření zakázek není pro tvůj účet povolené.');return;}return originalNew.apply(this,arguments);};
 const mutation=new MutationObserver(()=>applyAccess());mutation.observe(document.body,{subtree:true,childList:true});
 const oldSettings=renderSettings;
 renderSettings=function(){return oldSettings.apply(this,arguments);};
 window.perfectCreateOwner43=()=>createOwner(null);
 function drawSettings(root){if(!root.isConnected)return;root.querySelectorAll('[data-p40-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.p40Tab===settingsTab)));const area=root.querySelector('[data-p40-content]');area.innerHTML='<p class="p40-loading" role="status">Načítám…</p>';const seq=++settingsGeneration,token=sessionStorage.getItem('perfectAuthToken');const valid=()=>seq===settingsGeneration&&root.isConnected&&sessionStorage.getItem('perfectAuthToken')===token;
  if(settingsTab==='activity'&&superAdmin()){renderAudit(area,valid);return;}

  call('perfectSecurity40Get').then(data=>{if(!valid())return;const rolesShown=['ADMINISTRATOR','PRACOVNIK'],locked=(role,key)=>!data.editableRoles43?.includes(role)||(role==='PRACOVNIK'&&key==='roles.manage')||!superAdmin()&&!data.ceiling43.includes(key)&&!data.roles[role].includes(key);area.innerHTML=`${superAdmin()?'<div class="notice"><b>SUPERADMIN · neomezená oprávnění</b><br>Tento účet je skrytý z běžných seznamů a nepodléhá omezením rolí. Spravuješ také oprávnění administrátorů.</div>':'<p class="p40-sub">Měníš oprávnění pracovníků. Nastavení role Admin je zde pouze pro čtení.</p>'}<form data-p40-policy><div class="table-wrap p40-policy"><table><thead><tr><th>Pravomoc</th><th>Admin</th><th>Pracovník</th></tr></thead><tbody>${data.catalog.map(c=>`<tr><td>${esc(c.label)}</td>${rolesShown.map(role=>`<td><select class="field p43-choice" data-cap="${esc(c.key)}" data-role="${role}" aria-label="${esc(c.label)} · ${role==='ADMINISTRATOR'?'Admin':'Pracovník'}" ${locked(role,c.key)?'disabled':''}><option value="allow" ${data.roles[role].includes(c.key)?'selected':''}>Povolit</option><option value="deny" ${data.roles[role].includes(c.key)?'':'selected'}>Zamítnout</option></select></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="p40-sub">Tržby, výdělky všech zaměstnanců a úpravy cen jsou oddělené pravomoci. Vlastní odměnu má zaměstnanec ve svém profilu. Starší účty Směnář přebírají nastavení Pracovník.</p><p role="status" data-p40-message></p><div class="form-actions"><button class="btn" type="submit">Uložit pravomoce</button><button class="btn secondary" type="button" data-p40-reload>Obnovit</button></div></form>${data.ownerSetupAvailable43?'<section class="section" style="margin-top:20px"><h3>Můj nejvyšší účet</h3><p>Založ samostatné přihlášení, které bude mít plná práva a nebude v běžných seznamech účtů.</p><button class="btn" type="button" data-p43-owner>Založit můj skrytý účet</button></section>':''}`;area.querySelector('[data-p40-reload]').onclick=()=>drawSettings(root);const form=area.querySelector('[data-p40-policy]');form.onsubmit=async ev=>{ev.preventDefault();const roles={ADMINISTRATOR:[],PRACOVNIK:[],SMENAR:[]};form.querySelectorAll('select[data-cap]').forEach(select=>{if(select.value==='allow')roles[select.dataset.role].push(select.dataset.cap);});roles.SMENAR=roles.PRACOVNIK.slice();form.querySelectorAll('button,select').forEach(b=>b.disabled=true);const message=form.querySelector('[data-p40-message]');message.textContent='Ukládám pravomoce…';try{const result=await call('perfectSecurity40Save',[{version:data.version,roles}]);if(!valid())return;data.version=result.version;message.textContent='Pravomoce jsou uložené. Dotčené účty se přihlásí znovu.';}catch(e){if(valid())message.textContent=e.message;}finally{if(valid()){form.querySelectorAll('button').forEach(b=>b.disabled=false);form.querySelectorAll('select[data-cap]').forEach(b=>b.disabled=locked(b.dataset.role,b.dataset.cap));}}};const owner=area.querySelector('[data-p43-owner]');if(owner)owner.onclick=()=>createOwner(root);
 }).catch(e=>{if(valid())area.textContent=e.message;});
 }
 function createOwner(root){const overlay=document.createElement('div');overlay.className='overlay';overlay.style.zIndex='11050';overlay.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-label="Založení nejvyššího účtu"><div class="modal-head"><h2>Můj skrytý nejvyšší účet</h2><button type="button" class="close" aria-label="Zavřít">×</button></div><form data-p43-owner-form class="form-grid"><label class="full">Současné heslo administrátora<input class="field" name="currentPassword" type="password" required autocomplete="current-password"></label><label class="full">Nové samostatné uživatelské jméno<input class="field" name="username" required minlength="3" maxlength="40" autocomplete="off"></label><label>Nové heslo, min. 14 znaků<input class="field" name="password" type="password" minlength="14" maxlength="128" required autocomplete="new-password"></label><label>Potvrzení nového hesla<input class="field" name="confirmPassword" type="password" minlength="14" maxlength="128" required autocomplete="new-password"></label><p class="full" role="status" data-p43-owner-message></p><button type="submit" class="btn full">Vytvořit skrytý účet s plnými právy</button></form></section>';let busy=false;overlay.querySelector('.close').onclick=()=>{if(!busy)overlay.remove();};overlay.querySelector('form').onsubmit=async ev=>{ev.preventDefault();if(busy)return;const form=ev.currentTarget,msg=overlay.querySelector('[data-p43-owner-message]');if(form.elements.password.value!==form.elements.confirmPassword.value){msg.textContent='Nová hesla se neshodují.';return;}const payload={currentPassword:form.elements.currentPassword.value,username:form.elements.username.value,password:form.elements.password.value};busy=true;form.querySelectorAll('input,button').forEach(b=>b.disabled=true);msg.textContent='Zakládám účet…';try{await call('perfectSecurity43CreateOwner',[payload]);form.reset();overlay.remove();if(root?.isConnected)drawSettings(root);PerfectFeedback36.show(true,'Účet vytvořen. Odhlas se a přihlas novým jménem.');}catch(e){msg.textContent=e.message;}finally{busy=false;form.querySelectorAll('input,button').forEach(b=>b.disabled=false);}};document.body.append(overlay);}
 const auditNames={LOGIN:'Přihlášení',LOGOUT:'Odhlášení',OWNER_SETUP:'Založení účtu',perfectWebCreateOrderAddons31:'Vytvoření zakázky',perfectWebUpdateOrderAddons31:'Úprava zakázky / ceny',perfectWebAdminArchiveOrder:'Archivace zakázky',perfectDuplicates38Resolve:'Rozhodnutí o duplicitě',perfectAdminUsersSave:'Změna účtu',perfectSecurity40Save:'Změna oprávnění',perfectVoucher36Issue:'Vystavení poukazu',perfectVoucher36Redeem:'Čerpání poukazu',perfectV13MediaSave:'Nahrání fotografie'};
 const auditFilters={from:'',to:'',action:''};
 async function renderAudit(area,valid){try{const data=await call('perfectSecurity40Audit',[{offset:auditOffset,limit:30,...auditFilters}]);if(!valid())return;area.innerHTML=`<h3>Aktivity v aplikaci</h3><p class="p40-sub">Přihlášení a změny provedené přes aktualizovanou aplikaci. Záznamy začínají instalací V40; staré události se nevytvářejí zpětně. Hesla ani přihlašovací tokeny se nezapisují.</p><form class="p40-audit-grid"><label>Od<input class="field" type="date" name="from" value="${esc(auditFilters.from)}"></label><label>Do<input class="field" type="date" name="to" value="${esc(auditFilters.to)}"></label><label>Typ aktivity<select class="field" name="action"><option value="">Všechny</option>${Object.entries(auditNames).map(([key,label])=>`<option value="${key}" ${auditFilters.action===key?'selected':''}>${esc(label)}</option>`).join('')}</select></label><button class="btn secondary" type="submit">Použít filtr</button></form><div class="table-wrap"><table class="p40-audit-table"><thead><tr><th>Čas</th><th>Uživatel</th><th>Aktivita</th><th>Výsledek</th><th>Detail</th></tr></thead><tbody>${data.items.map(item=>`<tr><td>${esc(new Date(item.at).toLocaleString('cs-CZ',{timeZone:'Europe/Prague'}))}</td><td>${esc(item.actor||'Neověřeno')}</td><td>${esc(auditNames[item.action]||item.action)}${item.target?'<br><small>'+esc(item.target)+'</small>':''}</td><td>${item.status==='OK'?'<span class="pill good">Potvrzeno</span>':'<span class="pill warn">Neprovedeno</span>'}</td><td><details class="p40-audit-detail"><summary>Zobrazit změnu</summary><b>Před</b><pre>${esc(JSON.stringify(item.before,null,2))}</pre><b>Po</b><pre>${esc(JSON.stringify(item.after,null,2))}</pre>${esc(item.detail||'')}</details></td></tr>`).join('')||'<tr><td colspan="5">Pro tento filtr nejsou evidované aktivity.</td></tr>'}</tbody></table></div><div class="form-actions"><button class="btn secondary" data-p40-prev ${auditOffset===0?'disabled':''}>Předchozí</button><span>${data.total?auditOffset+1:0}–${Math.min(auditOffset+data.items.length,data.total)} z ${data.total}</span><button class="btn secondary" data-p40-next ${auditOffset+data.items.length>=data.total?'disabled':''}>Další</button></div>`;area.querySelector('form').onsubmit=ev=>{ev.preventDefault();const f=ev.currentTarget;for(const key of Object.keys(auditFilters))auditFilters[key]=f.elements[key].value;auditOffset=0;drawSettings(document.getElementById('perfectSecurity40'));};area.querySelector('[data-p40-prev]').onclick=()=>{auditOffset=Math.max(0,auditOffset-30);drawSettings(document.getElementById('perfectSecurity40'));};area.querySelector('[data-p40-next]').onclick=()=>{auditOffset+=30;drawSettings(document.getElementById('perfectSecurity40'));};}catch(e){if(valid())area.textContent=e.message;}}
 const oldLogin=showLogin;showLogin=function(){++settingsGeneration;settingsTab='access';auditOffset=0;document.getElementById('pa-users-overlay')?.remove();return oldLogin.apply(this,arguments);};
 // Klávesnice: dialog zachytí fokus; po zavření jej vrátí na původní tlačítko.
 const focusOrigins=new WeakMap();let knownDialogs=new Set();
 const dialogsObserver=new MutationObserver(()=>{const dialogs=new Set(document.querySelectorAll('[role=dialog]'));dialogs.forEach(dialog=>{if(knownDialogs.has(dialog))return;focusOrigins.set(dialog,document.activeElement);requestAnimationFrame(()=>dialog.querySelector('button,input,select,textarea,[tabindex]')?.focus({preventScroll:true}));});knownDialogs.forEach(dialog=>{if(!dialogs.has(dialog)){const origin=focusOrigins.get(dialog);if(origin?.isConnected)origin.focus({preventScroll:true});}});knownDialogs=dialogs;});dialogsObserver.observe(document.body,{childList:true,subtree:true});
 document.addEventListener('keydown',ev=>{const dialogs=[...document.querySelectorAll('[role=dialog]')];const dialog=dialogs.at(-1);if(!dialog)return;if(ev.key==='Escape'){const close=dialog.querySelector('.close,#pa-close');if(close&&!close.disabled)close.click();}if(ev.key==='Tab'){const items=[...dialog.querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(el=>!el.disabled&&!el.hidden);if(!items.length)return;if(ev.shiftKey&&document.activeElement===items[0]){ev.preventDefault();items.at(-1).focus();}else if(!ev.shiftKey&&document.activeElement===items.at(-1)){ev.preventDefault();items[0].focus();}}});
})();
